openapi: 3.1.0
info:
  title: 轻量 Linux 服务器管理面板 · API
  version: "1.0"
  description: |
    前后端唯一接口契约（事实源）。前端（panel-frontend）只通过本契约与后端（panel-backend）通信。

    设计要点（见《设计方案》§3.4）：
    - REST over HTTPS，JSON；统一前缀 `/api/v1`。
    - 统一响应信封 `Envelope`：`{code,message,data,request_id[,detail]}`。
    - 写操作（POST/PUT/PATCH/DELETE）必须带 `X-CSRF-Token` 头（双提交校验）+ `Origin` 白名单。
    - 所有耗时 > 1s 的操作返回 `202 Accepted` + `{task_id}`，通过 `GET /api/v1/tasks/{id}` 或 SSE `tasks` 频道获取进度。
    - 能力矩阵驱动：若某能力 `supported=false`，对应接口返回 `10009 unsupported`（而非伪造数据）。
    - 重活限流：安装/升级/卸载软件包、拉取镜像、运行备份、运行定时任务这些高成本写操作
      按 **(用户, 动作)** 限流 10 次 / 60 秒，超限返回 `429`（`code=10006`，
      `detail.retry_after_secs` 指明还需等待秒数）。登录另有独立的防暴力策略
      （失败计数 + 阶梯退避 + 15 分钟锁定），不受此限。
  contact:
    name: panel-backend

servers:
  - url: https://localhost:2083
    description: 单文件二进制（rustls 或前置反代）

tags:
  - { name: auth,        description: 认证 / 会话 / 密码 }
  - { name: system,      description: 能力矩阵 / 概览 / 指标 }
  - { name: processes,   description: 进程列表与信号 }
  - { name: services,    description: 服务（systemd 等）管理 }
  - { name: packages,    description: 软件包安装 / 卸载 }
  - { name: sites,       description: 站点与 SSL 证书 }
  - { name: files,       description: 文件管理（沙箱化） }
  - { name: db,          description: 数据库引擎接入 / 备份还原 }
  - { name: firewall,    description: 防火墙与安全基线 }
  - { name: security,    description: 登录安全 / 会话 / MFA }
  - { name: cron,        description: 计划任务 }
  - { name: logs,        description: 统一日志浏览器 }
  - { name: backups,     description: 备份计划与产物（本地） }
  - { name: assistant,   description: AI 运维助手（内置规则诊断，只读） }
  - { name: containers,  description: 容器（Docker）列举 / 镜像 / 创建 / 生命周期 / 安装 / 加组 / 备注 }
  - { name: tasks,       description: 异步任务中心 }
  - { name: settings,    description: 面板设置 }
  - { name: users,       description: 用户与角色 }
  - { name: audit,       description: 审计日志 }
  - { name: events,      description: SSE 实时频道 }
  - { name: terminal,    description: 内置 Web 终端（WebSocket） }

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: panel_sid
      description: |
        服务端会话 Cookie。属性：HttpOnly; Secure; SameSite=Strict; Path=/。
        空闲 30min / 绝对 12h 过期；登录后轮换 sid（防固定攻击）。
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        双提交 CSRF token。值取自可读 Cookie `panel_csrf`，写操作必须同源回传。
        与 Cookie 值一致性 + `Origin` 白名单双重校验。

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: 页码（从 1 开始）
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      schema: { type: string }
      description: 排序字段；`-` 前缀表示降序，如 `-created_at`。
    Q:
      name: q
      in: query
      schema: { type: string }
      description: 关键字过滤。
    LogId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: 日志源 id

  schemas:
    Envelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code:       { type: integer, example: 0, description: "0=成功；10xxx 通用 / 2xxxx 系统 / 3xxxx 服务 / 4xxxx 站点证书 / 5xxxx 文件 / 6xxxx 数据库 / 7xxxx 防火墙 / 8xxxx 任务 / 9xxxx 日志设置" }
        message:    { type: string, example: ok }
        data:       { description: 业务数据；失败时为 null }
        request_id: { type: string, example: nK8fA2xQ }
        detail:     { type: object, description: "失败时的字段级明细（如 {required, hint}）" }

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      description: 失败时 `data` 为 null，含 `detail`。

    LogRead:
      type: object
      properties:
        source: { type: string }
        lines:  { type: array, items: { $ref: '#/components/schemas/LogLine' } }
        capped: { type: boolean, description: 是否因行数上限被截断 }

    LogStats:
      type: object
      description: 日志聚合统计（启发式，用于概览而非精确分析）
      properties:
        source:  { type: string }
        scanned: { type: integer, description: 实际扫描行数 }
        capped:  { type: boolean, description: 是否触及 2000 行扫描上限 }
        buckets: { type: integer, description: 请求的时间分桶数 }
        levels:
          type: object
          description: level 分布（固定五档，缺档恒为 0）；优先采信 provider 的结构化 level，缺失时按文本关键词启发
          properties:
            error: { type: integer }
            warn:  { type: integer }
            info:  { type: integer }
            debug: { type: integer }
            other: { type: integer }
        histogram:
          type: array
          description: 时间直方图；无时间戳的源为空数组（不按行序伪造分布）
          items:
            type: object
            properties:
              start: { type: integer }
              end:   { type: integer }
              count: { type: integer }
        top_patterns:
          type: array
          description: 高频消息模式（数字/引号内容归一化后计数；仅保留出现 ≥2 次者，最多 8 条，按次数降序）
          items:
            type: object
            properties:
              pattern: { type: string }
              count:   { type: integer }

    TrashEntry:
      type: object
      description: 回收站条目（即条目目录里 meta.json 的内容）
      properties:
        id:            { type: string, description: "条目 id（纳秒时间戳-进程号），字符集限定 [0-9a-f-]" }
        original_path: { type: string, description: "删除前的绝对路径（恢复目标；恢复时会重新走沙箱校验）" }
        name:          { type: string, description: "原文件名（展示用）" }
        deleted_at:    { type: integer, description: "删除时间（unix 秒）" }
        kind:          { type: string, enum: [file, dir] }
        size_bytes:    { type: integer, description: "文件字节数；目录为 0（不递归统计，避免 IO 放大）" }

    MultipartInit:
      type: object
      properties:
        upload_id:    { type: string, description: "会话 id（字符集限定 [0-9a-f-]，服务端生成）" }
        chunk_size:   { type: integer, description: "服务端定档的分片大小（字节），客户端必须照此切分" }
        total_chunks: { type: integer }
        received:     { type: array, items: { type: integer }, description: "新会话恒为空" }
    MultipartStatus:
      type: object
      properties:
        upload_id:    { type: string }
        path:         { type: string, description: "目标路径（仅作记录；完成时会重新校验）" }
        size:         { type: integer }
        chunk_size:   { type: integer }
        total_chunks: { type: integer }
        received:     { type: array, items: { type: integer }, description: "已上传分片下标——客户端据此跳过已传部分（断点续传）" }

    Role:
      type: object
      properties:
        name:        { type: string }
        permissions: { type: array, items: { type: string } }
        builtin:     { type: boolean, description: "内置角色：权限由代码定义，不可改、不可删" }
        created_at:  { type: [integer, 'null'], description: "自定义角色的创建时间；内置为 null" }

    LogLine:
      type: object
      properties:
        ts:    { type: [integer, 'null'] }
        level: { type: ['string', 'null'] }
        text:  { type: string }

    # ───────────── 能力矩阵 ─────────────
    Capability:
      type: object
      required: [supported]
      properties:
        supported: { type: boolean }
        backend:   { type: [string, "null"], description: 实际后端，如 "systemd"/"nftables"/"apt" }
        reason:    { type: [string, "null"], enum: [null, not_implemented, binary_missing, daemon_unreachable, no_package_manager, init_unknown, unsupported_os, no_log_source, no_engine, openssl_missing, caddy_render_not_implemented], description: "不可用原因。`daemon_unreachable` 特指：二进制已安装但守护进程 socket 不可连（权限不足或未运行）——UI 应据此给出'加入 docker 组 / 启动服务'的可操作提示，而非笼统的'不支持'" }
    PlatformInfo:
      type: object
      properties:
        os:      { type: string, example: linux }
        arch:    { type: string, example: x86_64 }
        init:    { type: string, example: systemd }
        distro:  { type: [string, "null"], example: "debian:12" }
        kernel:  { type: [string, "null"], example: "6.1.0" }
    CapabilitiesResponse:
      type: object
      properties:
        platform:   { $ref: '#/components/schemas/PlatformInfo' }
        features:   { type: object, additionalProperties: { $ref: '#/components/schemas/Capability' } }
        # 高危操作的并发上限（P2-5）。前端读它而不是硬编码，避免两端各写一个数。
        limits:     { $ref: '#/components/schemas/Limits' }
        # ⚠ tier / polling 曾在这里声明，但本 handler 从未下发（它们走 /auth/me），
        #    属于契约漂移——已删。check_openapi 只查字节一致，抓不到这类语义偏差。
    Limits:
      type: object
      description: 高危操作的并发上限。新增上限时**必须**同时加到这里与实现处，保持单一真值。
      properties:
        terminal_max_sessions:
          type: integer
          description: Web 终端全局并发上限（全实例共享，不是每用户）。超出返回 503。
          example: 4

    ServiceConfig:
      type: object
      required: [path, content, writable, exists, target]
      properties:
        path:    { type: string, description: 配置文件绝对路径（unit=FragmentPath 指向的单元文件；dropin=/etc/systemd/system/<unit>.d/override.conf） }
        content: { type: string, description: 文件内容（UTF-8）；dropin 且文件尚不存在时为空串 }
        writable: { type: boolean, description: "false=位于发行版目录，修改可能在包升级时被覆盖，建议改用 drop-in" }
        exists:  { type: boolean, description: "该文件当前是否存在；dropin 目标下 false 表示保存即新建" }
        target:  { type: string, enum: [unit, dropin], description: 本次读写的目标（与请求的 target 一致） }

    # ───────────── 认证 ─────────────
    BootstrapRequest:
      type: object
      required: [token, username, password]
      properties:
        token:    { type: string, description: serve 首启打印的一次性引导令牌（32 位 hex） }
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 10, description: ≥10 位且含两类字符 }
    BootstrapStatusResponse:
      type: object
      properties:
        needs_bootstrap: { type: boolean, description: 数据库尚无 owner 账号 }
        token_active:    { type: boolean, description: 引导令牌是否仍有效（false 需重启 serve 重新生成） }
    BootstrapTokenResponse:
      type: object
      properties:
        token: { type: string, description: 一次性引导令牌明文（仅 localhost 可取，bootstrap 后失效） }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        totp:     { type: string, description: 启用 MFA 时必填 }
    MeResponse:
      type: object
      properties:
        user:         { type: string }
        role:         { type: string, enum: [owner, admin, operator, viewer] }
        permissions:   { type: array, items: { type: string } }
        allowed_roots: { type: array, items: { type: string } }
        # 能力矩阵（键=能力名）；与 /system/capabilities 的 features 同源
        capabilities: { type: object, additionalProperties: { $ref: '#/components/schemas/Capability' } }
        tier:         { type: string, enum: [nano, small, standard] }
        mfa_enabled:  { type: boolean, description: "MFA 是否已启用（审计 F8：由 /auth/me 权威下发，前端不再靠 enroll 报错文案反推）" }
        # ⚠ 曾把 capabilities 写成 CapabilitiesResponse（含 platform/features，那是
        #   /system/capabilities 的形状）、还多一个 polling——均与 MeResp 不符，已修。
    ChangePasswordRequest:
      type: object
      required: [old, new]
      properties:
        old: { type: string }
        new: { type: string }

    # ───────────── 系统 / 指标 ─────────────
    Overview:
      type: object
      properties:
        cpu_pct:       { type: number, example: 12.4 }
        mem_used_kib:  { type: integer }
        mem_total_kib: { type: integer }
        swap_used_kib: { type: integer }
        disk_used_bytes:  { type: integer }
        disk_total_bytes: { type: integer }
        net_in_bps:    { type: integer }
        net_out_bps:   { type: integer }
        load1:         { type: number }
        uptime_sec:    { type: integer }
    Directories:
      type: object
      description: 目录与文件位置；groups 为按用途分组的条目列表
      properties:
        binary:            { type: string, description: 面板二进制绝对路径 }
        frontend_embedded: { type: boolean, description: 前端是否已内嵌于二进制（无独立目录） }
        groups:
          type: array
          items:
            type: object
            properties:
              key:   { type: string, description: 分组键（panel/data/log/web/frontend） }
              title: { type: string, description: 分组中文标题 }
              items:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string, description: 条目中文名 }
                    path:  { type: string, description: 路径或说明文本 }
                    desc:  { type: string, nullable: true, description: 补充说明 }

        degraded:      { type: boolean, description: "true=已触发低配降频" }
        alerts:        { type: array, items: { $ref: '#/components/schemas/Alert' } }
    Alert:
      type: object
      properties:
        level: { type: string, enum: [info, warn, danger] }
        text:  { type: string, example: "证书 example.com 30 天内到期" }
    MetricSample:
      type: object
      properties:
        ts:        { type: integer }
        cpu_pct:   { type: number }
        mem_used_kib: { type: integer }
        mem_total_kib: { type: integer }
        net_in_bps:  { type: integer }
        net_out_bps: { type: integer }
        load1: { type: number }
    HistoryPoint:
      type: object
      properties:
        ts: { type: integer }
        cpu_pct: { type: number }
        mem_used_kib: { type: integer }
        net_in_bps: { type: integer }
        net_out_bps: { type: integer }

    # ───────────── 原始采样快照（/metrics/snapshot） ─────────────
    # 与 panel_os::SystemSnapshot 一一对应（未经聚合的完整一次采样）
    SystemSnapshot:
      type: object
      properties:
        ts_unix:    { type: integer }
        uptime_sec: { type: integer }
        cpu:        { $ref: '#/components/schemas/CpuSample' }
        mem:        { $ref: '#/components/schemas/MemSample' }
        disks:      { type: array, items: { $ref: '#/components/schemas/DiskSample' } }
        nets:       { type: array, items: { $ref: '#/components/schemas/NetSample' } }
        proc_count: { type: integer }
        tcp_conns:  { type: integer }
        temps:      { type: array, items: { $ref: '#/components/schemas/TempSample' }, description: "无 hwmon 的机器（多为虚拟机）为空数组" }
    TempSample:
      type: object
      properties:
        chip:     { type: string, description: "hwmon 芯片名（coretemp / k10temp / nvme / acpitz …）" }
        label:    { type: string, description: "通道标签；内核未提供 label 时回退为 tempN，绝不凭空命名" }
        celsius:  { type: number, description: "摄氏度（内核毫摄氏度 / 1000）" }
        critical: { type: boolean, description: "是否达到 tempN_crit 阈值；读不到 crit 时恒 false（不臆测告警）" }
    CpuSample:
      type: object
      properties:
        total_pct:    { type: number }
        per_core_pct: { type: [array, "null"], items: { type: number }, description: "低配档位为 null" }
        load1:        { type: number }
        load5:        { type: number }
        load15:       { type: number }
    MemSample:
      type: object
      properties:
        total_kib:     { type: integer }
        used_kib:      { type: integer }
        available_kib: { type: integer }
        buffers_kib:   { type: integer }
        cached_kib:    { type: integer }
        swap_total_kib:{ type: integer }
        swap_used_kib: { type: integer }
    DiskSample:
      type: object
      properties:
        mount_point:   { type: string }
        device:        { type: string }
        fs_type:       { type: string }
        total_bytes:   { type: integer }
        used_bytes:    { type: integer }
        is_network_fs: { type: boolean }
    NetSample:
      type: object
      properties:
        iface:       { type: string }
        rx_bytes:    { type: integer }
        tx_bytes:    { type: integer }
        rx_rate_bps: { type: integer }
        tx_rate_bps: { type: integer }

    # ───────────── 站内通知 ─────────────
    Notification:
      type: object
      properties:
        id:     { type: integer }
        ts:     { type: integer }
        level:  { type: string, enum: [info, warn, crit] }
        source: { type: string, enum: [backup, restore, cert, task, security, system] }
        title:  { type: string }
        body:   { type: [string, "null"] }
        read:   { type: boolean }

    # ───────────── MFA ─────────────
    MfaEnroll:
      type: object
      properties:
        secret:         { type: string, description: "base32 密钥（手工录入用）" }
        otpauth_uri:    { type: string, description: "otpauth:// URI（验证器扫码用）" }
        recovery_codes: { type: array, items: { type: string }, description: "**一次性返回**，库里只存哈希，此后无法取回" }

    # ───────────── 安全基线修复结果 ─────────────
    SecurityApplyResult:
      type: object
      properties:
        changed:   { type: boolean, description: "false=已符合预期，未写盘" }
        backup:    { type: [string, "null"], description: "修改前的备份文件路径，可据此回滚" }
        validated: { type: boolean, description: "是否通过配置语法校验" }

    # ───────────── 进程 ─────────────
    Process:
      type: object
      properties:
        pid:  { type: integer }
        name: { type: string }
        cpu_pct: { type: number }
        mem_rss_kib: { type: integer }
        user: { type: string }
        cmdline: { type: string }
    KillRequest:
      type: object
      properties:
        signal:
          type: string
          enum: [term, hup, kill]
          default: term
          description: "term=SIGTERM，允许进程正常收尾；hup=SIGHUP，常用于触发重载配置；kill=SIGKILL，立即终止且不给收尾机会。缺省 term —— 强制信号必须显式要求。"

    # ───────────── 服务 ─────────────
    ServiceUnit:
      type: object
      properties:
        name:   { type: string, example: nginx.service }
        state:  { type: string, enum: [active, inactive, failed, activating, deactivating, unknown] }
        enabled: { type: boolean }
        sub:    { type: string }
        desc:   { type: string }
    ServiceStatus:
      type: object
      properties:
        name: { type: string }
        state: { type: string }
        active_since: { type: [integer, "null"] }
        pid:  { type: [integer, "null"] }
    EnabledRequest:
      required: [enabled]
      type: object
      properties: { enabled: { type: boolean } }

    # ───────────── 本机便签（025） ─────────────
    ServerNote:
      type: object
      properties:
        id:         { type: integer, description: 便签 id（迁移 025 迁入的旧单例内容恒为 1） }
        content:    { type: string, description: 便签内容（trim 后非空，≤500 字） }
        updated_at: { type: integer, description: 最近更新时间（unix 秒） }

    # ───────────── WAF 策略模板（026） ─────────────
    WafTemplate:
      type: object
      properties:
        id:         { type: integer, description: 模板 id }
        name:       { type: string, description: 模板名（唯一，trim 后非空，≤64 字） }
        waf_profile: { type: string, enum: [basic, strict], description: 防护档位（basic / strict） }
        rate_per_sec: { type: integer, description: CC 限速（每 IP 每秒请求数）；0 = 不限速 }
        burst:      { type: integer, description: 突发桶容量；0 = 由 rate×2 计算（仅限速时生效） }
        ip_allow:   { type: array, items: { type: string }, description: IP 白名单（IPv4 或 IPv4/前缀）；非空即白名单模式（只放行名单内，其余拒绝），此时 ip_deny 被忽略 }
        ip_deny:    { type: array, items: { type: string }, description: IP 黑名单（IPv4 或 IPv4/前缀）；ip_allow 非空时被忽略 }
        created_at: { type: integer, description: 创建时间（unix 秒） }
        updated_at: { type: integer, description: 更新时间（unix 秒） }

    # ───────────── 拦截事件（027，威胁日志） ─────────────
    BlockEvent:
      type: object
      properties:
        id:         { type: integer, description: 事件 id }
        site:       { type: string, description: 站点名 }
        ts:         { type: integer, description: 发生时间（unix 秒，UTC） }
        remote_addr: { type: string, description: 客户端 IP }
        method:     { type: string, description: HTTP 方法 }
        uri:        { type: string, description: 请求路径（含查询串） }
        status:     { type: integer, description: 状态码（403 拦截/拒绝、405 方法被拒、429 限速） }
        referer:    { type: string, description: Referer }
        user_agent: { type: string, description: User-Agent }
      description: |
        拦截事件（WAF 页「威胁日志」数据源）。⚠ 无规则级归因：WAF 规则 / 敏感文件拒绝 /
        IP 黑名单都返回同色 403，access log 无标记可区分，故只记状态码。仅采集「开了独立
        access log」的站点；由内部周期任务 waf.collect 每 60s 增量采集，保留 30 天。

    # ───────────── WAF 拦截告警配置（028） ─────────────
    WafAlertCfg:
      type: object
      properties:
        enabled:   { type: boolean, description: 是否启用拦截告警 }
        threshold: { type: integer, description: 阈值——近时间窗内单站拦截数超过即告警（1~100000） }
        window_min: { type: integer, description: 时间窗（分钟，1~1440） }
      description: |
        WAF 拦截告警配置（单例）。采集后按「近 window_min 分钟内每站拦截数 > threshold」
        推送站内通知（source=security）；同窗内每站至多一条（时间桶去重），攻击持续则每窗一条。
        告警进站内通知中心。

    # ───────────── 软件包 ─────────────
    Package:
      type: object
      properties:
        name:    { type: string }
        label:   { type: string }
        version: { type: [string, "null"] }
        manager: { type: [string, "null"], example: apt }
        path:    { type: [string, "null"] }
        held:    { type: boolean, description: 是否被 apt-mark hold 钉住（仅已安装包有意义）：挡 apt-get upgrade 的自动升级，不挡显式指定版本安装；非 apt 管理器恒 false }
        unit:
          type: object
          nullable: true
          description: 该软件包对应的主服务单元（用于软件卡片「服务管理」入口）。
            直接由包文件清单（dpkg -L）推导，故 enabled 但当前未运行的服务也能正确关联，
            不依赖 systemctl list-units 的运行时枚举。
          properties:
            name:  { type: string, description: 完整单元名（含 .service 后缀），如 nginx.service }
            state: { type: string, description: 服务状态（systemd 口径，active/inactive/failed/activating/deactivating/unknown） }

    PackageCatalog:
      type: object
      description: |
        白名单条目（完整集合）。前端据此渲染友好品牌名与**用途说明**——软件卡片上的
        「说明」直接渲染这几个字段，前端不再硬编码文案（包集合与包的说明都只有一个事实源）。
      properties:
        name:  { type: string }
        label: { type: string }
        external: { type: boolean, description: 官方仓库通常不含此包，需先在目标机配置第三方软件源才能安装 }
        summary:  { type: string, description: 用途：一句话说明这个软件是什么 }
        features: { type: string, description: 主要功能：用户会实际用到的能力 }
        scenes:   { type: string, description: 适用场景：什么情况下该装它 }
        entry:    { type: string, description: "使用方式 / 访问入口：面板内入口 + 面板外的真实访问方式。面板没有的入口会如实写「面板无独立页面」，不编造" }
        howto:    { type: string, description: "怎么配：到了 entry 所指的页面之后具体填什么（必填项 / 典型值 / 常见错法）。与 entry 分开——「去哪」与「填什么」是用户卡住的两个不同位置；面板内无需填写时写「无需填」，不留空" }
        units:
          type: array
          items: { type: string }
          description: |
            该包在 systemd 上对应的服务单元名（如 nginx.service、grafana-server.service）。
            服务详情页据此在 catalog 里反查条目，**在本页**直接展开用途/功能/场景/怎么配，
            而不是把用户送去「软件」页再点一次「?」。

            为什么必须由后端给：包名与单元名不是同一个字符串，且差异没有规律
            （mariadb-server→mariadb.service、grafana→grafana-server.service、
            redis→redis-server.service、php-fpm→php8.4-fpm.service）。前端若按包名拼
            `name + '.service'` 去猜，这几条会全部落空且**没有任何报错**，用户看到的是
            「这个服务没有软件说明」——与「这个软件本来就没说明」无法区分。

            空数组表示该包没有常驻服务单元（应用运行时 nodejs/default-jdk/golang-go/cargo、
            工具链 wireguard-tools 之类），前端据此不渲染软件说明区。

    # ───────────── 站点 / SSL ─────────────
    Site:
      type: object
      properties:
        id:       { type: integer }
        name:     { type: string }
        domains:  { type: array, items: { type: string } }
        root:     { type: string }
        kind:     { type: string, enum: [static, proxy, php, redirect, routed], description: "站点类型（库内口径为 static | reverse_proxy | php | redirect | routed；API 把 reverse_proxy 呈现为 proxy）" }
        enabled:  { type: boolean, description: "期望状态：是否已纳入 Web 服务器配置（新建默认 true）。它**不**代表站点正在对外服务——后者见 deployed" }
        deployed: { type: boolean, description: "配置是否已真实下发到 Web 服务器（apply 成功写入 conf_path 后为 true）。enabled=true 而 deployed=false 即「已登记、未下发」，此时访问域名会连接失败" }
        tls:      { type: boolean }
        waf_enabled:      { type: boolean, description: "WAF 是否启用" }
        waf_profile:      { type: [string, "null"], enum: [basic, strict, null], description: "WAF 档位；未启用为 null" }
        waf_rate_per_sec: { type: [integer, "null"], description: "CC 限速（每 IP 每秒请求数）；null = 不限速" }
        waf_burst:        { type: [integer, "null"], description: "突发桶容量" }
        upstreams:        { type: [array, "null"], items: { type: string }, description: "反代后端列表（kind=proxy 时存在，如 [\"http://127.0.0.1:3000\"]）；其余为 null" }
        fpm:              { type: [string, "null"], description: "php-fpm 目标（kind=php 时存在，unix:/path.sock | host:port）；其余为 null" }
        spa:              { type: boolean, description: "SPA 回退（kind=static 时有效）：true 时未命中文件的路径交给 /index.html（history 路由单页应用）。缺省 false" }
        redirect_target:  { type: [string, "null"], description: "整站重定向目标 URL（kind=redirect 时存在，绝对 http(s)://）；其余为 null" }
        redirect_code:    { type: [integer, "null"], description: "整站重定向状态码（kind=redirect 时存在；301/302/307/308）；其余为 null" }
        routes:          { type: array, items: { $ref: '#/components/schemas/SiteRoute' }, description: "多路由表（kind=routed 时非空；其余恒为 []，不会返回 null）" }
        manual_conf:     { type: boolean, description: "手动维护：true = 磁盘上的配置文件由用户原始编辑维护，表单「保存并应用」不再覆盖它；可经「恢复面板托管」清零（停用/重新启用路径也会清零）" }
        conf_stale:      { type: boolean, description: "**未同步**（仅 manual_conf=true 且站点启用时有意义）：表单的部署相关字段与「配置文件最后一次落盘时的指纹」不一致——即面板里看到的规格 ≠ 线上文件（表单改过、文件没跟上）。由「重新生成配置」（conf/restore 或 apply 带 regen_conf）清零" }
        custom_conf:     { type: [string, "null"], description: "自定义配置片段（owner 维护）：插在主 server 块尾部，随表单「保存并应用」重新渲染；null = 无。与「手动维护」互补——片段属托管态（随保存重渲染），整文件手动维护则不被覆盖" }
        www_redirect:    { type: string, enum: [off, to_www, to_bare], description: "www ↔ 非 www 跳转（020，**只对主域名 domains[0] 生效**，子域不参与）：off = 不处理；to_www = 裸域跳到 www.<主域名>；to_bare = www.<主域名> 跳回裸域。渲染为独立 server 块 + return 301（刻意不用 if）" }
        tls_profile:     { type: string, enum: [compat, modern, strict], description: "加密套件档位（020）：compat = 兼容老客户端（含弱套件）、modern = 默认（TLSv1.2+ 主流套件）、strict = 仅 TLSv1.3 + 前向保密" }
        tls_min:         { type: string, enum: [TLSv1, TLSv1.1, TLSv1.2, TLSv1.3], description: "TLS 版本下限（020），渲染时展开为「下限及以上」的 ssl_protocols 列表（如 TLSv1.2 → `TLSv1.2 TLSv1.3`）；默认 TLSv1.2" }
        hsts:            { type: boolean, description: "HSTS 开关（020）：开启后 HTTPS 响应带 Strict-Transport-Security。⚠ 浏览器在 max-age 期间强制 HTTPS、服务端**无法撤回**——故默认关闭，UI 开启需二次确认" }
        hsts_max_age:    { type: integer, description: "HSTS max-age（秒，0 ~ 63072000）。默认 300：先小步验证、确认无误再调大" }
        hsts_include_sub: { type: boolean, description: "HSTS includeSubDomains（020）：一并约束子域。误用代价高，故独立开关、不随 hsts 一起开" }
        hsts_preload:    { type: boolean, description: "HSTS preload（020）：申请进浏览器内置列表，**几乎不可逆**，独立开关" }
        rewrite_preset:  { type: string, enum: [none, wordpress, laravel, thinkphp, typecho, discuz, custom], description: "伪静态预置模板（020，仅 php 类型有意义）：预置值替换默认的 try_files 兜底；custom 时使用 rewrite_custom；none = 不做伪静态" }
        rewrite_custom:  { type: [string, "null"], description: "rewrite_preset=custom 时的原始 rewrite 文本（020）：原样进 `location /`，上限 64 KiB；其余为 null" }
        conf_external:   { type: boolean, description: "外部修改（020）：磁盘上的配置文件与「最后一次落盘的内容」不一致——文件在面板之外被改动过。面板**不会**静默覆盖它（无从判断是人工有意、脚本误写还是攻击），由用户决定「重新生成覆盖 / 改为自定义片段 / 手动接管」" }
        # ── 021：访问控制 / 反代增强 / 站点日志 ──
        ip_allow:       { type: [array, "null"], items: { type: string }, description: "IP 白名单（单 IP 或 CIDR，IPv4）。非空即进入白名单模式：只放行名单内、其余 deny all，此时 ip_deny 被忽略（UI 二者互斥置灰）" }
        ip_deny:        { type: [array, "null"], items: { type: string }, description: "IP 黑名单（单 IP 或 CIDR，IPv4）。ip_allow 非空时被忽略" }
        auth_basic:     { type: boolean, description: "HTTP Basic Auth 开关（口令不落库，仅在其设置时经 openssl 生成 apr1 摘要写入 htpasswd 文件）" }
        auth_user:      { type: [string, "null"], description: "Basic Auth 用户名（auth_basic=true 时必填）" }
        lb_policy:      { type: string, enum: [least_conn, ip_hash], description: "多后端负载均衡策略（021）：least_conn = 最小连接（默认）、ip_hash = 同客户端落同后端。单后端时 upstream 块不存在、策略不生效" }
        proxy_connect_timeout: { type: integer, description: "反代建连超时（秒，1~3600），默认 60" }
        proxy_send_timeout:    { type: integer, description: "反代发送超时（秒，1~3600），默认 60" }
        proxy_read_timeout:    { type: integer, description: "反代读取超时（秒，1~3600），默认 60" }
        log_access:     { type: boolean, description: "站点独立访问日志开关（021）：开启后由面板指定路径，可下载/清空" }
        log_error:      { type: boolean, description: "站点独立错误日志开关（021）" }
        log_error_level: { type: string, enum: [debug, info, notice, warn, error, crit, alert, emerg], description: "错误日志级别（021），默认 error" }
        remark: { type: string, description: "对象说明（备注，022）：这台站点干嘛的、为什么这么配；无则为空串" }
        last_applied_at: { type: [integer, "null"], description: "上次下发时间（023）：最近一次「配置写入磁盘且 nginx reload 成功」的 Unix 时间戳（秒）。五条下发路径（apply/重新生成/自定义配置写入/回滚/站点 PATCH）均会刷新；从未下发过为 null" }
    SiteRoute:
      type: object
      required: [prefix, kind]
      properties:
        prefix: { type: string, pattern: "^/[A-Za-z0-9._~/-]*$", description: "URL 前缀，须以 / 开头；只允许字母数字与 / - _ . ~（该值**直接进 nginx 配置文本**，注入校验在后端）。末尾多余的 / 会被归一化（/api/ ≡ /api）；**必须有一条 prefix=/ 作兜底**，否则漏掉的路径会落到别的站点去" }
        kind:   { type: string, enum: [proxy, static, php] }
        upstreams:       { type: array, items: { type: string }, description: "kind=proxy 的后端（至少 1 个）。格式要求同 SiteApply.upstreams" }
        spa:             { type: boolean, description: "kind=static：未命中是否回退 /index.html（history 路由单页应用）" }
        fpm:             { type: string, description: "kind=php 的 php-fpm 目标" }
        front_controller: { type: string, description: "kind=php 的**入口脚本（必填，相对站点根、须以 / 开头）**。多路由下一律用 front controller 形式而非 `location ~ \\.[Pp]hp$`——后者会被 `^~` 前缀屏蔽、PHP 请求将落到静态处理" }
        root:            { type: [string, "null"], description: "kind=static 的**路由级根目录（可选，覆盖站点级 root）**。留空继承站点根目录；填了则这条静态路由从它自己的目录读文件（如 `/` 前端产物 + `/blog` 另一套静态站）。后端经 resolve_site_root 约束到 site_root 之内，防路径穿越；其余为 null" }
    App:
      type: object
      properties:
        id:            { type: integer }
        name:          { type: string, description: "应用名（同时派生 systemd 单元名与反代站点名）" }
        runtime:       { type: string, enum: [node, go, rust, java, python, dotnet, php, custom] }
        runtime_label: { type: string, description: "运行时展示名（由后端给出，前端不自行翻译）" }
        workdir:       { type: string, description: "工作目录绝对路径（须已存在）" }
        exec_start:    { type: string, description: "进 systemd ExecStart= 的启动命令" }
        run_user:      { type: [string, "null"], description: "运行用户。**新建时缺省自动分配 `site-<应用名>`**（系统用户 + nologin 禁止登录）；显式传 `root` 则以 root 跑（不推荐）。删应用**不会**删除该系统用户（可能被别处引用）" }
        env:           { type: array, description: "环境变量 [[k, v], ...]。**面板不代存秘密**（无加密存储），敏感值请勿填" }
        port:          { type: integer, description: "监听端口（反代上游指向 http://127.0.0.1:<port>）" }
        auto_restart:  { type: boolean, description: "崩溃自动重启（systemd Restart=always）" }
        enabled:       { type: boolean, description: "期望状态：是否已托管（单元已装 + 站点已下发）" }
        domains:       { type: array, items: { type: string }, description: "自动反代站点的域名" }
        created_at:    { type: integer }
        unit:          { type: string, description: "systemd 单元名（panel-app-<name>.service），可拿去日志页看输出" }
        state:         { type: [string, "null"], description: "systemd 状态；探测失败为 null（不因此让整页失败）" }
    AppRuntimeInfo:
      type: object
      properties:
        key:           { type: string }
        label:         { type: string }
        default_port:  { type: integer }
        runtime_pkg:   { type: [string, "null"], description: "面板包白名单里的系统包名；null = 面板不托管该运行时（前端据此不显示安装状态，不做「你没有 X」的断言）" }
        default_exec:  { type: string }
        typical:       { type: string, description: 典型框架，帮用户确认没选错运行时 }
        purpose:       { type: string, description: "用途：这个运行时是跑什么的（回答「Node 和 Python 我该选哪个」）" }
        choose_when:   { type: string, description: "什么情况下该选它。刻意只给判断依据、不做性能排名——语言选型不该由面板替用户下结论" }
        build_hint:    { type: string, description: "构建步骤提示（纯文案，面板不执行构建）" }
    AppCreate:
      type: object
      required: [name, runtime, workdir]
      properties:
        name:         { type: string, pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$", description: "字母数字开头，后可接字母数字与 . _ -，长度 1~63；派生的 systemd 单元名须同样合法" }
        runtime:      { type: string, enum: [node, go, rust, java, python, dotnet, php, custom] }
        workdir:      { type: string, description: "已存在的绝对路径（刻意不受站点根沙箱约束——那是给静态文件用的）" }
        exec_start:   { type: [string, "null"], description: "留空则用运行时默认命令；custom 运行时必填" }
        run_user:     { type: [string, "null"], description: "运行用户。**留空 = 自动分配 `site-<应用名>`**（面板会`useradd --system --no-create-home --shell nologin` 创建）。显式指定一个**不存在**的用户会报 400（视为拼错，面板不擅自创建）；指定已存在的的（root/www-data）则直接复用" }
        env:          { type: array, description: "[[k, v], ...]；键禁含换行与 =" }
        port:         { type: [integer, "null"], description: "留空则用运行时默认端口" }
        auto_restart: { type: [boolean, "null"] }
        domains:      { type: array, items: { type: string }, description: "启用态必填（据此自动建反代站点）；每项须为≥2 级且顶级域真实存在的域名" }
        enabled:      { type: [boolean, "null"], description: "缺省 true；false = 只登记不装单元不建站点" }
    AppPatch:
      type: object
      properties:
        runtime:      { type: string, enum: [node, go, rust, java, python, dotnet, php, custom] }
        workdir:      { type: string }
        exec_start:   { type: string }
        run_user:     { type: [string, "null"], description: "运行用户。**省略 = 沿用现有值**；传空串 = 改回自动分配 `site-<应用名>`" }
        env:          { type: array }
        port:         { type: integer }
        auto_restart: { type: boolean }
        domains:      { type: array, items: { type: string } }
        enabled:      { type: boolean, description: "切到 false 会撤下反代站点并删除单元文件" }
    SiteWaf:
      type: object
      required: [enabled]
      description: |
        站点 WAF。规则集是**编译期常量**，用户只能选档位与数值——刻意不开放
        "自定义正则"：那等于把配置注入面直接交出去，而且一条写坏的正则会让
        nginx 拒绝加载**整份**配置（一个站点出错，全机站点一起挂）。

        三条容易踩的语义：
        - `waf` **整个字段缺省 = 保留库中现有配置**（不是"关闭"）。apply 按
          "期望状态"覆盖，但静默关掉一层防护比多一次点击危险得多，而且调用方
          未必都知道有 `waf` 这个字段。要关请显式 `{"enabled": false}`。
        - `rate_per_sec: 0` 与缺省等价（不限速）。**若此时给了 `burst` 会被 400 拒绝**：
          "配了但没生效"的静默失败比直接报错糟糕得多。
        - 开启严格档会额外拦空 UA 与非白名单方法（405）。基础档不拦，因为
          空 UA 也可能是正常脚本——默认值应当"够用且不误伤"。
      properties:
        enabled:      { type: boolean, description: "显式 false 才关闭；缺省按上面的规则保留" }
        profile:      { type: string, enum: [basic, strict], default: basic, description: "basic = SQLi / XSS / 路径穿越 / 敏感文件探测 / 恶意 UA；strict 在其之上增加空 UA、非白名单方法（405）与更宽的注入 / 扫描器关键词。**严格档误杀概率更高**，故不设为默认" }
        rate_per_sec: { type: integer, minimum: 0, maximum: 1000, description: "CC 限速（每 IP 每秒请求数）；0 / 缺省 = 不限速。超限返回 429（而非 503——503 会让监控误判成服务挂了，实际只是这个客户端被限流）" }
        burst:        { type: integer, minimum: 0, maximum: 10000, description: "突发桶容量；缺省 = rate * 2" }
    SiteCreate:
      type: object
      required: [name, domains]
      properties:
        name:    { type: string, pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$", description: "站点名称（用户可见的虚拟主机标识）。白名单：字母数字开头，后可接字母数字与 . _ -，长度 1~63；不得含空格、/、以点开头或仅为 .。非法值返回 400" }
        domains: { type: array, items: { type: string }, description: "站点域名，至少一个。须为合法域名：≥2 级、每段字符集 [a-zA-Z0-9-] 且首尾非连字符、顶级域须为真实 IANA 根区后缀（.local/.lan/.internal 等私有后缀亦放行），或 IPv4 字面量（4 段且每段 0~255）。非法值返回 400" }
        root:    { type: [string, "null"] }
        enabled: { type: boolean, description: "创建后的初始启用状态，缺省 true。注意：本接口只写入站点定义，**不下发配置**——无论取值如何，站点都要等一次 apply 才会真正对外服务。该字段供编辑页开关回显" }
    SitePatch:
      type: object
      properties:
        name:    { type: string, pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$", description: "站点名称，**支持改名**。白名单同 SiteCreate（字母数字开头，后可接字母数字与 . _ -，长度 1~63）；非法值返回 400。nginx 配置按域名派生（conf 文件名取首个域名、server_name 即 domains）、root 建站时已固化为绝对路径、证书按 domain 绑定，三者都与 name 无关，故改名**不需要重新下发配置**；与其它站点同名返回 409（site name exists）" }
        domains: { type: array, items: { type: string }, description: "站点域名，至少一个。须为合法域名：≥2 级、每段字符集 [a-zA-Z0-9-] 且首尾非连字符、顶级域须为真实 IANA 根区后缀（.local/.lan/.internal 等私有后缀亦放行），或 IPv4 字面量（4 段且每段 0~255）。非法值返回 400" }
        root:    { type: string }
        enabled: { type: boolean, description: "启用状态。与当前值**不相同**时会真正同步 Web 服务器：true=按当前设置渲染配置并下发 + reload（此前从未 apply 的站点在此补齐）；false=从 Web 服务器移除该站点配置 + reload，站点停止对外服务。与当前值相同则只写库" }
        force_https: { type: boolean }
    SiteApply:
      type: object
      required: [name, domains, root]
      properties:
        name:        { type: string }
        domains:     { type: array, items: { type: string }, description: "站点域名，至少一个。校验规则同 SiteCreate.domains（语法 + 真实 TLD / IPv4 语义）。非法值返回 400" }
        root:        { type: string }
        force_https: { type: boolean }
        kind:        { type: string, enum: [static, proxy, php, redirect, routed], default: static, description: "站点类型；默认静态" }
        upstreams:
          type: array
          description: "kind=proxy 的后端（1~16 个）。必须是 http(s)://host[:port]，不得含路径/查询/片段——该值直接进 nginx 配置文本，注入校验在后端（前端校验不可作数）"
          items: { type: string }
        fpm:         { type: string, description: "kind=php 的 php-fpm 目标：unix:/绝对路径.sock 或 host:port" }
        spa:         { type: boolean, description: "kind=static 的 SPA 回退开关：true 时 try_files 末项为 /index.html（history 路由单页应用）。缺省 false" }
        redirect_target: { type: string, description: "kind=redirect 的目标 URL（必须是 http:// 或 https:// 开头的绝对地址）；直接进 nginx return 指令，注入校验在后端" }
        redirect_code:   { type: integer, enum: [301, 302, 307, 308], description: "kind=redirect 的状态码；缺省 301" }
        routes:      { type: array, items: { $ref: '#/components/schemas/SiteRoute' }, description: "kind=routed 的路由表（至少一条，且必须含一条 prefix=/ 的兜底）。**省略 = 保留库中现有路由表**（与 waf 同语义，不静默清空）" }
        waf:         { $ref: '#/components/schemas/SiteWaf' }
        regen_conf:  { type: boolean, default: false, description: "手动维护站点的「重新生成配置」开关：true = 忽略手动维护保护，按本次表单**重新渲染并覆盖**磁盘配置（覆盖前自动备份到 <data_dir>/conf-backups/），成功后清零 manual_conf（回到面板托管）。缺省 false = 保持保护语义（跳过渲染/下发、表单仅入库）——此后若两边不一致，Site.conf_stale 会亮起" }
        custom_conf: { type: [string, "null"], description: "自定义配置片段：插在主 server 块尾部（所有 location 之后）。null = 清除、省略 = 保留库中现值（与 routes/waf 同「不静默清空」语义）；仅 owner 可改（非 owner 提交即 403）；上限 64 KiB；内容随部署指纹，改动会触发「未同步」判定" }
        www_redirect: { type: string, enum: [off, to_www, to_bare], description: "www ↔ 非 www 跳转（020），省略 = 保留库中现值。见 Site.www_redirect" }
        tls_profile: { type: string, enum: [compat, modern, strict], description: "加密套件档位（020），省略 = 保留现值。见 Site.tls_profile" }
        tls_min: { type: string, enum: [TLSv1, TLSv1.1, TLSv1.2, TLSv1.3], description: "TLS 版本下限（020），省略 = 保留现值。见 Site.tls_min" }
        hsts: { type: boolean, description: "HSTS 开关（020），省略 = 保留现值。⚠ 不可撤回，UI 需二次确认" }
        hsts_max_age: { type: integer, description: "HSTS max-age（020），秒；0 ~ 63072000，省略 = 保留现值" }
        hsts_sub: { type: boolean, description: "HSTS includeSubDomains（020），省略 = 保留现值" }
        hsts_preload: { type: boolean, description: "HSTS preload（020），省略 = 保留现值" }
        rewrite_preset: { type: string, enum: [none, wordpress, laravel, thinkphp, typecho, discuz, custom], description: "伪静态预置模板（020），省略 = 保留现值；仅 php 类型有意义" }
        rewrite_custom: { type: [string, "null"], description: "rewrite_preset=custom 时的原始 rewrite 文本（020）：null/空白 = 清除、省略 = 保留现值；上限 64 KiB" }
        # ── 021：访问控制 / 反代增强 / 站点日志 ──
        ip_allow:       { type: array, items: { type: string }, description: "IP 白名单（单 IP 或 CIDR，IPv4）；空串 = 清除，省略 = 保留现值" }
        ip_deny:        { type: array, items: { type: string }, description: "IP 黑名单（单 IP 或 CIDR，IPv4）；ip_allow 非空时被忽略；省略 = 保留现值" }
        auth_basic:     { type: boolean, description: "Basic Auth 开关；省略 = 保留现值" }
        auth_user:      { type: [string, "null"], description: "Basic Auth 用户名（auth_basic=true 时必填）；省略 = 保留现值" }
        auth_pass:      { type: [string, "null"], description: "Basic Auth 口令（021，只写不读）：提交后经 openssl 生成 apr1 摘要写入 htpasswd 文件，口令本身不落库、不回显；省略 = 保留现值" }
        lb_policy:      { type: string, enum: [least_conn, ip_hash], description: "负载均衡策略；省略 = 保留现值" }
        proxy_connect_timeout: { type: integer, description: "建连超时（秒，1~3600）；省略 = 保留现值" }
        proxy_send_timeout:    { type: integer, description: "发送超时（秒，1~3600）；省略 = 保留现值" }
        proxy_read_timeout:    { type: integer, description: "读取超时（秒，1~3600）；省略 = 保留现值" }
        log_access:     { type: boolean, description: "独立访问日志开关；省略 = 保留现值" }
        log_error:      { type: boolean, description: "独立错误日志开关；省略 = 保留现值" }
        log_error_level: { type: string, enum: [debug, info, notice, warn, error, crit, alert, emerg], description: "错误日志级别；省略 = 保留现值" }
    Cert:
      type: object
      properties:
        id:          { type: integer }
        domain:      { type: string }
        issuer:      { type: [string, "null"] }
        not_after:   { type: [integer, "null"] }
        days_left:   { type: [integer, "null"] }
        auto_renew:  { type: boolean }
        renew_state: { type: string, enum: [idle, pending, ok, failed] }
        source:      { type: string, enum: [acme, selfsigned, manual], description: '证书记录的来源（落库值）。注意申请接口的 method 用连字符 self-signed，落库时统一为 selfsigned' }
    SslApply:
      type: object
      required: [method]
      properties:
        domains:
          type: array
          items: { type: string }
          description: 留空则沿用站点现有域名
        method:
          type: string
          enum: [self-signed, http-01, dns-01]
          default: self-signed
          description: self-signed=面板自签（同步、离线可用，需 openssl）；http-01/dns-01=ACME
        email: { type: [string, "null"] }

    # ───────────── 文件 ─────────────
    FileEntry:
      type: object
      properties:
        name:     { type: string }
        path:     { type: string }
        is_dir:   { type: boolean }
        size:     { type: integer }
        mode:     { type: string, example: "0644" }
        owner:    { type: string }
        mtime:    { type: integer }
        sensitive: { type: boolean, description: "位于敏感黑名单（/etc/shadow 等）时为 true，禁止读取/下载" }
    FileList:
      type: object
      properties:
        path: { type: string }
        # 实现返回 entries（非 items）：文件列表不走分页，改为单次上限 + truncated 如实告知
        entries: { type: array, items: { $ref: '#/components/schemas/FileEntry' } }
        truncated: { type: boolean, description: 单次上限 1000；为 true 表示结果不完整，UI 需提示 }
    FileAction:
      type: object
      required: [op, paths]
      properties:
        op:    { type: string, enum: [move, copy, delete, trash, chmod] }
        paths: { type: array, items: { type: string }, maxItems: 100, description: 批量目标（允许根内路径） }
        dest:  { type: [string, "null"], description: move/copy 的目标目录 }
        mode:  { type: [string, "null"], description: chmod 的八进制模式（如 644） }

    FileStatOut:
      type: object
      properties:
        path:        { type: string }
        kind:        { type: string, enum: [dir, file, symlink, other] }
        size:        { type: integer }
        mode:        { type: [string, "null"], description: 八进制串（如 644） }
        owner:       { type: [string, "null"] }
        modified_at: { type: integer }

    FileActionResult:
      type: object
      properties:
        op:         { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              path:  { type: string }
              ok:    { type: boolean }
              error: { type: [string, "null"] }
        ok_count:   { type: integer }
        fail_count: { type: integer }

    FileUploadResult:
      type: object
      properties:
        path: { type: string }
        size: { type: integer }

    # ───────────── 数据库 ─────────────
    DbConnection:
      type: object
      required: [name, engine]
      properties:
        id:         { type: integer }
        name:       { type: string }
        engine:     { type: string, enum: [sqlite, mysql, postgres] }
        host:       { type: [string, "null"] }
        port:       { type: [integer, "null"] }
        username:   { type: [string, "null"] }
        default_db: { type: [string, "null"] }
        # 仅表示外部客户端（psql / mysqldump 等）是否已安装；不代表该连接可以连通
        client_ready: { type: boolean }
        # 只读 SQL 控制台是否对该连接开放（UI 按钮门控的唯一依据）。
        # 与 client_ready 不是同一个问题、也不能互相推导：判据是**有没有服务端物理
        # 只读护栏**（SQLite 只读连接 / PG default_transaction_read_only 会话）。
        # MySQL 装了客户端也依然是 false。前端不得用 engine 自行猜测此值。
        readonly_sql: { type: boolean }
        remark:     { type: string, description: "对象说明（备注，022）：这个库干嘛的、为何这样配置；无则为空串" }
    # 只读 SQL 控制台的引擎相关文案（默认语句 + 示例）。
    # 放在后端是为了让"哪个引擎长什么样"只有一份：放前端就会与后端口径漂移。
    SqlConsoleMeta:
      type: object
      required: [engine, readonly_sql, default_sql, samples]
      properties:
        engine: { type: string, enum: [sqlite, mysql, postgres] }
        readonly_sql:
          type: boolean
          description: "与 DbConnection.readonly_sql 同源同值；打开控制台前再确认一次，避免列表数据过期导致按钮亮着、内容说不能跑"
        default_sql: { type: string }
        samples:
          type: array
          items:
            type: object
            required: [label, sql]
            properties:
              label: { type: string }
              sql:   { type: string }
        note:
          type: string
          description: "只读护栏的诚实边界（按引擎给）：写语句会被服务端拒绝，但少数配置类函数（如 PG 的 pg_reload_conf）不受约束。前端原样展示"
    DbConnectionCreate:
      required: [name, engine]
      type: object
      properties:
        name: { type: string }
        engine: { type: string, enum: [sqlite, mysql, postgres] }
        host: { type: string }
        port: { type: integer }
        username: { type: string, description: "mysql/postgres 必填（连主机账号）；sqlite 为本地文件、可空" }
        password: { type: string, description: "明文传输，后端用主密钥加密存储" }
        default_db: { type: string }
    DbTable:
      type: object
      properties:
        name: { type: string }
        rows:
          type: integer
          description: |
            精确行数（PG/MySQL 用**一条** UNION ALL 查询一次取回全部对象的行数，
            SQLite 在同一连接内逐表 COUNT(*)）。取不到时为 -1
            ——刻意不伪造成 0：0 会被读成"空表"，而 -1 才是"未知"。
        engine: { type: [string, "null"] }
        kind:
          type: string
          enum: [table, view]
          description: |
            表对象种类。它区分「表」与「视图」——两者在 `tables()` 里都会被返回，
            前端据此能说清「这个库只有视图」这类情况，而不是笼统报「无表」。
    DbSchema:
      type: object
      properties:
        name: { type: string }
        previewable:
          type: boolean
          description: |
            点进这一层能否列出可预览的对象。**这是实现能力，不是"有没有东西"**：
            PostgreSQL 当前 `tables()` 固定读 `table_schema='public'`，
            所以其余 schema 为 false（点进去必然为空，需在控件上直接说清）；
            MySQL 库恒为 true；SQLite 不返回 schema 层（空数组）。
    DbRowPreview:
      type: object
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: {} } }
        page: { type: integer }
        total: { type: integer }

    # ───────────── 备份计划 ─────────────
    BackupPlan:
      type: object
      required: [kind, target, dest_dir]
      properties:
        id:          { type: integer }
        kind:        { type: string, enum: [panel, site, db], description: "panel=面板自身数据；site=站点文件；db=数据库连接（按连接名，产物为 .db 或 .sql）" }
        target:      { type: string, description: "panel 固定 'panel'；site 为站点名" }
        cron_expr:   { type: [string, "null"], description: "留空=仅手动执行" }
        keep_count:  { type: integer, default: 7 }
        dest_dir:    { type: string, description: "产物目录，必须在面板 backup_dir 之内" }
        enabled:     { type: boolean, default: true }
        last_run_at: { type: [integer, "null"] }
        last_result: { type: [string, "null"] }
        encrypt:     { type: boolean, default: false, description: "产物静态加密（AES-256-GCM 分块容器，见 panel-os/backup.rs）；主密钥来自 /var/lib/forkpanel/master.key 且不落库。加密会抬高恢复门槛——主密钥丢失等于备份全废，故默认关闭，由用户显式选择" }
        remote_kind:  { type: [string, "null"], enum: [webdav, s3, null], description: "远端副本类型；null=仅本地。本地备份挡不住整机故障（磁盘坏、误删、机房事故），异地那份才是真兜底" }
        remote_url:   { type: [string, "null"], description: "webdav: 目标目录 URL；s3: endpoint（如 https://s3.example.com）。仅 http/https" }
        remote_bucket: { type: [string, "null"], description: "s3: bucket 名（s3 必填）" }
        remote_prefix: { type: [string, "null"], description: "s3: key 前缀；两端斜杠会被吃掉" }
        remote_region: { type: [string, "null"], description: "s3: region，缺省 us-east-1" }
        remote_user:  { type: [string, "null"], description: "webdav 用户名 / s3 access key id；留空 = 匿名访问" }
        remote_has_secret: { type: boolean, description: "是否已存凭据。**凭据本身永不返回**——它是打开备份仓库的钥匙，回显没有任何正当理由够得上" }
    RemoteConfig:
      type: object
      description: |
        远端副本配置。**字段级三态语义**（前端不回显密文，必须区分"不改"与"清空"）：
        - `remote_kind`：缺省 = 保持现状；`none` = 关闭远端（连同凭据一并清空）；`webdav` / `s3` = 启用；
        - url / bucket / prefix / region / user：缺省 = 保持现状；**空串 = 清空该项**；
        - `remote_secret`：缺省或空串 = **保留已存凭据**（不能解释成清空，否则每次改 cron
          都会顺手把凭据抹掉，而用户根本无从发现）；非空 = 加密后替换。
        启用时 `remote_url` 必填、s3 另需 `remote_bucket`；填了 `remote_user` 就必须同时给凭据
        （`--user "ak:"` 这类半截配置在远端必然认证失败，不如保存时就说清楚）。
      properties:
        remote_kind:   { type: string, enum: [none, webdav, s3] }
        remote_url:    { type: string }
        remote_bucket: { type: string }
        remote_prefix: { type: string }
        remote_region: { type: string }
        remote_user:   { type: string }
        remote_secret: { type: string, description: "明文凭据，落库前用主密钥 AES-256-GCM 加密；永远不会被回读" }
    BackupArtifact:
      type: object
      properties:
        name:  { type: string }
        size:  { type: integer }
        mtime: { type: integer }

    # ───────────── 容器 ─────────────
    AssistantReport:
      type: object
      properties:
        question:     { type: string }
        scope:        { type: string, enum: [all, cpu, mem, disk, log, service, security, backup] }
        generated_at: { type: integer }
        summary:      { type: string }
        narrative:    { type: string, nullable: true, description: LLM 人话叙事（未配置 LLM 时缺省不返回） }
        findings:     { type: array, items: { $ref: '#/components/schemas/AssistantFinding' } }
        ctx:          { $ref: '#/components/schemas/AssistantContext' }

    AssistantFinding:
      type: object
      properties:
        id:         { type: string, description: 稳定规则标识（如 cpu.high） }
        severity:   { type: string, enum: [info, warn, crit] }
        title:      { type: string }
        evidence:   { type: array, items: { type: string }, description: 真实数据引用 }
        suggestion: { type: string }
        action:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/AssistantAction' } ]

    AssistantAction:
      type: object
      description: 仅导航语义——处置由用户在目标视图人工确认
      properties:
        kind: { type: string, enum: [navigate] }
        view: { type: string, example: /services }

    AssistantContext:
      type: object
      properties:
        cpu_pct:      { type: number }
        load1:        { type: number }
        load5:        { type: number }
        load15:       { type: number }
        mem_used_kib: { type: integer }
        mem_total_kib: { type: integer }
        proc_count:   { type: integer }
        uptime_sec:   { type: integer }
        top_disk:
          nullable: true
          type: object
          properties:
            mount:    { type: string }
            used_pct: { type: number }

    ContainerSummary:
      type: object
      description: 等价 `docker ps -a` 的一行（含已停止容器）
      properties:
        id:      { type: string, description: 完整容器 ID（64 位 hex；UI 可裁剪展示） }
        name:    { type: string, example: web-proxy }
        image:   { type: string, example: "nginx:1.27-alpine" }
        state:   { type: string, enum: [running, exited, created, paused, restarting, dead, removing] }
        status:  { type: string, description: CLI 的人类可读状态，如 `Up 9 days`、`Exited (0) 2 hours ago` }
        ports:   { type: string, example: "0.0.0.0:80->80/tcp" }
        created: { type: string, description: 容器创建时间（CLI 原始格式，不做本地化推算） }
        remark:  { type: string, description: "对象说明（备注，022）：容器不入库，备注存 container_remarks 引用表；列表端点一次性联查挂载，无则为空串" }
        compose_project: { type: ["string", "null"], description: "所属 Compose 项目名（读 com.docker.compose.project 标签）；非 compose 创建的容器为 null（不是空串——空串无法与「项目名就是空」区分）" }
        compose_service: { type: ["string", "null"], description: "所属 Compose 服务名（com.docker.compose.service 标签）；与 compose_project 同生共死" }
    ComposeStackService:
      type: object
      description: |
        面板编排的单个服务。⚠ **这是类型层面的白名单**：只有这里列出的字段会被
        渲染进 compose.yaml。`privileged` / `cap_add` / `pid` / `network_mode` /
        `user` / `devices` 等等价宿主 root 的字段在类型上就不存在，因此不可能被写入
        ——不依赖运行时黑名单拦截（compose 字段空间会随版本增长，黑名单追不上）。
      required: [name, image]
      properties:
        name:      { type: string, description: "服务名（字母数字与 . _ -，不得以 - 开头）；项目内唯一" }
        image:     { type: string, example: "nginx:1.27-alpine", description: 含 shell 元字符会被拒 }
        command:   { type: array, items: { type: string }, description: 覆盖镜像 ENTRYPOINT；逐元素作为独立参数，不拼 shell 串 }
        ports:     { type: array, items: { type: string }, description: "host:container[/proto]，如 8080:80" }
        env:       { type: array, items: { type: string }, description: "KEY=VALUE；KEY 须符合 shell 标识符规则" }
        volumes:   { type: array, items: { type: string }, description: "具名卷或非敏感宿主路径；`/`、`/etc`、`docker.sock`、`/proc`、`/sys`、`/var/run` 会被拒" }
        restart:   { type: string, enum: [no, on-failure, always, unless-stopped] }
        mem_limit: { type: string, example: 512m, description: "内存上限（512m / 2g / 纯字节数）" }
    ComposeStack:
      type: object
      description: 面板管理的编排项目（磁盘读出）
      properties:
        project:             { type: string }
        dir:                 { type: string, description: stack 目录绝对路径（即 compose 工作目录） }
        config_file:         { type: string, description: 渲染产物 compose.yaml 绝对路径 }
        services:            { type: array, items: { $ref: '#/components/schemas/ComposeStackService' } }
        externally_modified: { type: boolean, description: "compose.yaml 与「由 .forkpanel-compose.json 重新渲染的结果」不一致 ⇒ 被外部改过；为 true 时面板拒绝覆盖保存" }
    ContainerImage:
      type: object
      description: 等价 `docker images` 的一行（含悬空镜像 `<none>`）
      properties:
        id:         { type: string, example: "sha256:1111..." }
        repository: { type: string, example: nginx }
        tag:        { type: string, example: "1.27-alpine" }
        size:       { type: string, description: CLI 已格式化的体积，如 `55.3MB` }
        created:    { type: string }

    Fail2banJail:
      type: object
      description: fail2ban 单个监狱（jail）状态
      properties:
        name:            { type: string, example: sshd }
        enabled:         { type: boolean }
        currently_failed: { type: integer }
        total_failed:    { type: integer }
        banned:          { type: integer, description: 当前封禁数 }
        banned_ips:      { type: array, items: { type: string } }
    Fail2banStatus:
      type: object
      description: fail2ban 总览
      properties:
        available: { type: boolean, description: fail2ban-client 是否存在 }
        active:    { type: boolean, description: fail2ban 服务是否运行中 }
        jails:     { type: array, items: { $ref: '#/components/schemas/Fail2banJail' } }

    # ───────────── 防火墙 ─────────────
    FirewallStatus:
      type: object
      properties:
        active:  { type: boolean }
        backend: { type: [string, "null"], example: nftables }
        snapshot_id: { type: [string, "null"], description: "最近一次规则快照，用于应急恢复" }
    FirewallRule:
      type: object
      properties:
        id:      { type: string }
        port:    { type: string, example: "443" }
        proto:   { type: string, enum: [tcp, udp] }
        direction: { type: string, enum: [in, out] }
        action:  { type: string, enum: [allow, deny] }
        source:  { type: [string, "null"], description: "CIDR 或 null=任意" }
        note:    { type: [string, "null"] }
    FirewallRuleCreate:
      required: [port, action]
      type: object
      properties:
        port: { type: string }
        proto: { type: string, enum: [tcp, udp], default: tcp }
        direction: { type: string, enum: [in, out], default: in }
        action: { type: string, enum: [allow, deny] }
        source: { type: [string, "null"] }
        note: { type: string }

    # ───────────── 安全 ─────────────
    SecurityBaselineItem:
      type: object
      properties:
        key: { type: string, example: ssh.permit_root_login }
        title: { type: string }
        ok: { type: boolean }
        current: { type: string, example: "yes" }
        expected: { type: string, example: "no" }
        advice: { type: string }
        applicable: { type: boolean, description: "该平台是否适用（如非 systemd 则 false）" }
    SessionInfo:
      type: object
      description: 在线会话（内存 SessionCache 快照）。ip 刻意不采集——会话层无对端地址管道，不伪造数据
      properties:
        id:         { type: string, description: 会话 sid（吊销用） }
        user:       { type: string }
        role:       { type: string }
        ip:         { type: "null", nullable: true }
        created_at: { type: integer }
        last_seen:  { type: integer, description: 最后活跃；按 idle_timeout/4（上限 60s）节流落库，跨进程恢复时保留库值而非恢复时刻 }
        expires_at: { type: integer }
        idle_secs:  { type: integer, description: now - last_seen；受落库节流影响，最多滞后 60s }
        current:    { type: boolean, description: 是否为发起本次请求的会话 }

    # ───────────── 计划任务 ─────────────
    CronJob:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        expr: { type: string, example: "0 3 * * *" }
        kind: { type: string, enum: [script, backup, cert_renew, internal] }
        enabled: { type: boolean }
        timeout_sec: { type: integer }
        next_runs: { type: array, items: { type: integer }, description: "下次 N 次执行时间戳（服务端计算）" }
        last_status: { type: [string, "null"], enum: [ok, failed, running, null] }
    CronJobCreate:
      required: [name, expr, kind]
      type: object
      properties:
        name: { type: string }
        expr: { type: string }
        kind: { type: string, enum: [script, backup, cert_renew, internal] }
        payload: { type: object }
        timeout_sec: { type: integer, default: 1800 }
    CronRun:
      type: object
      properties:
        id: { type: string }
        started_at: { type: integer }
        finished_at: { type: [integer, "null"] }
        exit_code: { type: [integer, "null"] }
        output_path: { type: [string, "null"] }

    # ───────────── 日志 ─────────────
    LogSource:
      type: object
      properties:
        id: { type: string, example: panel }
        label: { type: string }
        readable: { type: boolean }
    LogQuery:
      type: object
      properties:
        source: { type: string }
        filter: { type: [string, "null"], description: "服务端字面量子串过滤（刻意不支持正则）" }
        level:  { type: [string, "null"], enum: [debug, info, warn, error, null] }
        since:  { type: [integer, "null"] }
        until:  { type: [integer, "null"] }
        follow: { type: boolean, default: false }
        limit:  { type: integer, maximum: 2000, default: 200 }

    # ───────────── 任务中心 ─────────────
    Task:
      type: object
      description: task_runs 行实态（无 params/stage 列，不虚构）
      properties:
        id: { type: integer }
        key: { type: string, description: 任务体标识（task_id） }
        kind: { type: string }
        state: { type: string, enum: [queued, running, ok, failed, canceled, interrupted] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        started_at: { type: [integer, "null"] }
        finished_at: { type: [integer, "null"] }
        exit_code: { type: [integer, "null"] }
        output_path: { type: [string, "null"] }
        duration_secs: { type: [integer, "null"], description: 仅单体详情返回 }
        needs_human: { type: boolean, description: interrupted 时为 true（UI 标红） }

    # ───────────── 设置 / 用户 / 审计 ─────────────
    SettingsReport:
      type: object
      description: 三段诚实模型——runtime 可改即生效；deployment 只读展示实际生效值；reserved 种子预留未接线
      properties:
        runtime:
          type: object
          properties:
            endpoint:     { type: [string, "null"], description: assistant.llm_endpoint }
            model:        { type: [string, "null"], description: assistant.llm_model }
            api_key_set:  { type: boolean, description: assistant.llm_api_key 是否已设置（永不明文） }
            narrative:     { type: boolean, description: assistant.llm_narrative 开关；false（缺省）时后端不外发任何诊断数据，diagnose 回退纯规则报告 }
            narrative_note: { type: string, description: 开启后会外发什么的披露文案（后端单一维护，前端原样展示，不得自行改写） }
        deployment:
          type: object
          description: 部署级只读展示（改 config.toml 并重启）
          properties:
            read_only: { type: boolean }
            tier:      { type: string, enum: [nano, small, standard] }
            hint:      { type: string }
        reserved:
          type: object
          properties:
            wired:  { type: boolean, enum: [false] }
            note:   { type: string }
            values: { type: object, additionalProperties: { type: string } }

    SettingsPatch:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          description: 键值对；白名单=assistant.llm_endpoint/llm_model/llm_api_key/llm_narrative；值 null=清除该键
          additionalProperties: { type: [string, boolean, "null"] }
    DashboardCardPref:
      type: object
      required: [id, visible]
      properties:
        id:      { type: string, enum: [cpu, mem, disk, load, net], description: 卡片标识（与前端 ovCards 对应） }
        visible: { type: boolean }
    DashboardLayout:
      type: object
      required: [cards]
      description: 概览页指标卡布局；数组顺序即展示顺序，至少一张 visible
      properties:
        cards:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/DashboardCardPref' }
    OnboardingStep:
      type: object
      description: 上手清单的一步；done = checked || auto（真实状态优先于勾选，防进度撒谎）
      properties:
        id:      { type: string, enum: [trust_ca, create_site, issue_cert, enable_waf, backup_plan] }
        title:   { type: string }
        desc:    { type: string }
        route:   { type: string, description: 前端路由（清单每步「前往」直达） }
        checked: { type: boolean, description: 用户手动勾选 }
        auto:    { type: boolean, description: 由后端真实状态判定已完成（此时勾选框禁用：勾了结果也不变） }
        done:    { type: boolean, description: checked || auto —— 前端只看这一个字段 }
    OnboardingState:
      type: object
      description: 首启上手清单整体状态（读：仅需登录；写：需 settings.manage）
      properties:
        steps:      { type: array, items: { $ref: '#/components/schemas/OnboardingStep' } }
        dismissed:  { type: boolean, description: 用户选择「不再显示」 }
        updated_at: { type: [integer, "null"] }
        done_count: { type: integer }
        total:      { type: integer }
    OnboardingPut:
      type: object
      description: 整体替换勾选集合（未提供 checked 视为清空）；未知 id → 400 且不部分写入
      properties:
        checked:   { type: array, items: { type: string } }
        dismissed: { type: boolean }
    LlmTestReq:
      type: object
      description: 省略/null 字段回落到库里已存值；填写则以本次为准（先测后存，避免保存后才发现配错）
      properties:
        endpoint: { type: string }
        model:    { type: string }
        api_key:  { type: string, description: 明文密钥，仅用于本次探测：不落库、不回显、不入日志 }
    LlmTestResult:
      type: object
      description: 探测结论。**探测失败一律 ok:false + detail，不返回 500**——配置错是用户的事，不是服务器错误
      properties:
        ok:          { type: boolean }
        latency_ms:  { type: integer }
        endpoint:    { type: string }
        model:       { type: [string, "null"] }
        model_found: { type: boolean, description: model 是否出现在 /v1/models 的返回里 }
        model_count: { type: [integer, "null"], description: 可用模型数；响应不是预期 JSON 时为 null }
        status:      { type: [integer, "null"], description: HTTP 状态码；请求层失败（连不上/超时）时为 null }
        detail:      { type: string, description: 人话结论：成功摘要或失败原因 }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [owner, admin, operator, viewer] }
        allowed_roots: { type: array, items: { type: string } }
        mfa_enabled: { type: boolean }
        disabled: { type: boolean }
        created_at: { type: integer }
        last_login_at: { type: [integer, "null"] }
    UserCreate:
      required: [username, password, role]
      type: object
      properties:
        username: { type: string }
        password: { type: string, description: "最小长度 10 + 弱口令字典检查" }
        role: { type: string, enum: [admin, operator, viewer] }
        allowed_roots: { type: array, items: { type: string } }
    UserPatch:
      type: object
      properties:
        role: { type: string, enum: [admin, operator, viewer] }
        allowed_roots: { type: array, items: { type: string } }
        disabled: { type: boolean }
        password: { type: string }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        ts: { type: integer }
        actor: { type: string }
        actor_ip: { type: [string, "null"] }
        action: { type: string }
        target: { type: [string, "null"] }
        # queued：任务类操作（如 package.install）入队即记录，终态另由任务表承载
        result: { type: string, enum: [ok, denied, error, queued] }
        detail_json: { type: [string, "null"] }
    AuditPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    TaskAccepted:
      type: object
      properties:
        task_id: { type: string }

paths:
  # ───────── 版本 / 认证 ─────────
  /api/v1/version:
    get:
      tags: [system]
      security: []
      summary: 版本与契约协商
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  api: { type: string, example: "1.0" }
                  app: { type: string, example: "0.4.2" }
                  build: { type: string }

  /api/v1/auth/status:
    get:
      tags: [auth]
      security: []
      summary: 首启状态（前端据此切换登录页/首启向导）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/BootstrapStatusResponse' } } }

  /api/v1/auth/bootstrap-token:
    get:
      tags: [auth]
      security: []
      summary: 取引导令牌（仅 localhost，供首启页「从文件读取令牌」）
      description: |
        仅当数据库无 owner 且引导令牌有效时返回 data.token（一次性引导令牌明文）。
        令牌由 serve 首启写入 <data_dir>/bootstrap.token（权限 0600、root 拥有）；本端点
        **只接受回环地址的 peer**（非 loopback 一律 403），远程攻击者即使能访问端口也取不到。
        bootstrap 成功后该文件立即删除，此后返回 404。
      responses:
        '200':
          description: ok（data.token 即一次性引导令牌）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/BootstrapTokenResponse' } } }
        '403': { description: 请求来自非回环地址（10003） }
        '404': { description: 无 owner 不成立 / 令牌已用或已过期（10004） }

  /api/v1/auth/bootstrap:
    post:
      tags: [auth]
      security: []
      summary: 首启创建 owner（需 serve 首启打印的一次性引导令牌）
      description: |
        仅当数据库无 owner 且引导令牌有效时成功。令牌由 serve 首启打印到终端，
        一次性、30 分钟有效、只存内存。不开放常驻注册。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapRequest' } } } }
      responses:
        '204': { description: 创建成功，令牌即焚 }
        '401': { description: 令牌无效或已过期（10011） }
        '409': { description: 已存在 owner（10005） }

  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录（204 + Set-Cookie）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '204': { description: "成功，Set-Cookie: panel_sid / panel_csrf" }
        '401': { description: 认证失败（含防暴力退避） }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出（清会话）
      responses: { '204': { description: ok } }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户 + 权限 + 能力矩阵
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/MeResponse' } } }

  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: 修改密码（需 CSRF）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } } }
      responses: { '204': { description: ok }, '403': { description: 旧密码错误 } }

  # ───────── MFA（TOTP，RFC 6238） ─────────
  #
  # 三条都需登录：enroll 是"给自己的账户绑定第二因子"，不能是公开端点。
  # enroll 只生成密钥、**不立即生效**，须 verify 通过才启用——
  # 否则用户 enroll 后没完成绑定就会把自己锁在门外。
  /api/v1/auth/mfa/enroll:
    post:
      tags: [auth]
      summary: 生成 TOTP 密钥与 10 个一次性恢复码（**尚未生效**）
      security: [cookieAuth, csrfHeader]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/MfaEnroll' } } }
        '400': { description: 已启用 MFA（需先关闭才能更换） }
  /api/v1/auth/mfa/verify:
    post:
      tags: [auth]
      summary: 用动态口令确认绑定并正式启用（只认动态口令，不认恢复码）
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, description: "6 位动态口令" } } }
      responses:
        '200': { description: ok }
        '400': { description: 动态口令不正确 / 尚未 enroll }
  /api/v1/auth/mfa/disable:
    post:
      tags: [auth]
      summary: 关闭 MFA（**必须出示**动态口令或恢复码，防被劫持会话顺手关闭）
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, description: "6 位动态口令或恢复码" } } }
      responses:
        '200': { description: ok }
        '400': { description: 口令或恢复码不正确 / MFA 未启用 }

  # ───────── 系统 / 能力 / 指标 ─────────
  /api/v1/system/capabilities:
    get:
      tags: [system]
      summary: 能力矩阵（前端菜单唯一开关）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/CapabilitiesResponse' } } }

  /api/v1/system/overview:
    get:
      tags: [system]
      summary: 一次性快照（仪表盘卡片）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/Overview' } } }
  /api/v1/system/directories:
    get:
      tags: [system]
      summary: 目录与文件位置（装到哪/数据/日志/Web服务器/前端内嵌）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/Directories' } } }

  /api/v1/server/notes:
    get:
      tags: [system]
      summary: 本机便签列表（025，多条；全部登录用户可读）
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/ServerNote' } } } } } } } }
    post:
      tags: [system]
      summary: 新建便签（025，写需 system.manage；上限 50 条，超出 400）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, description: 便签内容，trim 后非空、≤500 字 } } } } } }
      responses: { '200': { description: ok }, '400': { description: 内容为空/超长/条数达上限 } }
  /api/v1/server/notes/{id}:
    patch:
      tags: [system]
      summary: 更新便签（025，写需 system.manage；id 不存在 → 404）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, description: 便签内容，trim 后非空、≤500 字 } } } } } }
      responses: { '200': { description: ok }, '400': { description: 内容为空/超长 }, '404': { description: 便签不存在 } }
    delete:
      tags: [system]
      summary: 删除便签（025，写需 system.manage；id 不存在 → 404）
      security: [cookieAuth, csrfHeader]
      responses: { '200': { description: ok }, '404': { description: 便签不存在 } }
  /api/v1/waf/templates:
    get:
      tags: [sites]
      summary: WAF 策略模板列表（026，读需 site.view）
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/WafTemplate' } } } } } } } }
    post:
      tags: [sites]
      summary: 新建 WAF 策略模板（026，写需 site.manage；重名 409、超量 400）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, description: 模板名（唯一，trim 后非空，≤64 字） }, profile: { type: string, enum: [basic, strict], description: 防护档位，缺省 basic }, rate_per_sec: { type: integer, description: CC 限速；0 = 不限速 }, burst: { type: integer, description: 突发桶；0 = 由 rate×2 计算 }, ip_allow: { type: string, description: IP 白名单，逗号或空格分隔 }, ip_deny: { type: string, description: IP 黑名单，逗号或空格分隔 } } } } } }
      responses: { '200': { description: ok }, '400': { description: 校验失败（空名/超长/未知档位/数值越界/burst 无限速/非法 IP） }, '409': { description: 模板名已存在或数量达上限 } }
  /api/v1/waf/templates/{id}:
    get:
      tags: [sites]
      summary: WAF 策略模板详情（026，读需 site.view）
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/WafTemplate' } } } } } }, '404': { description: 模板不存在 } }
    patch:
      tags: [sites]
      summary: 更新 WAF 策略模板（026，写需 site.manage；可改名，重名 409）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, profile: { type: string, enum: [basic, strict] }, rate_per_sec: { type: integer }, burst: { type: integer }, ip_allow: { type: string }, ip_deny: { type: string } } } } } }
      responses: { '200': { description: ok }, '400': { description: 校验失败 }, '404': { description: 模板不存在 }, '409': { description: 模板名已存在 } }
    delete:
      tags: [sites]
      summary: 删除 WAF 策略模板（026，写需 site.manage）
      security: [cookieAuth, csrfHeader]
      responses: { '200': { description: ok }, '404': { description: 模板不存在 } }
  /api/v1/waf/events:
    get:
      tags: [sites]
      summary: 拦截事件列表（027，威胁日志；读需 site.view）
      parameters:
        - { name: site, in: query, required: false, schema: { type: string }, description: 按站点名过滤 }
        - { name: status, in: query, required: false, schema: { type: integer }, description: 按状态码过滤（403/405/429） }
        - { name: since, in: query, required: false, schema: { type: integer }, description: 起始时间（unix 秒，含） }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: 每页条数（默认 100，上限 500） }
        - { name: offset, in: query, required: false, schema: { type: integer }, description: 偏移 }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/BlockEvent' } } } } } } } }
  /api/v1/waf/alert:
    get:
      tags: [sites]
      summary: WAF 拦截告警配置（028，读需 site.view）
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/WafAlertCfg' } } } } } } }
    put:
      tags: [sites]
      summary: 更新 WAF 拦截告警配置（028，写需 site.manage；缺省字段保留现值）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, threshold: { type: integer, description: 1~100000 }, window_min: { type: integer, description: 1~1440 } } } } } }
      responses: { '200': { description: ok }, '400': { description: 阈值或窗宽越界 } }
  /api/v1/system/users:
    get:
      tags: [system]
      summary: 枚举本机系统账户（运行用户下拉数据源）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { type: object, properties: { name: { type: string }, uid: { type: integer }, gid: { type: integer }, shell: { type: string }, login_allowed: { type: boolean } } } } } }

  /api/v1/metrics/realtime:
    get:
      tags: [system]
      summary: 内存环形缓冲最近 N 秒
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 60 }, description: 秒数 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/MetricSample' } } } }

  /api/v1/metrics/history:
    get:
      tags: [system]
      summary: 历史聚合（nano 档位不落盘 → 返回 empty）
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 24h, 7d], default: 24h } }
        - { name: gran,  in: query, schema: { type: string, enum: [1m, 1h], default: 1m } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/HistoryPoint' } } } }

  /api/v1/metrics/snapshot:
    get:
      tags: [system]
      summary: 即时完整采样快照（未聚合的原始 SystemSnapshot）
      description: >
        ProfessionalView 使用：返回未经聚合的一次完整采样（含 CPU 每核、内存拆解、
        各挂载点磁盘、各网卡速率）。与 /system/overview 的区别是 overview 为仪表盘聚合卡片。
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/SystemSnapshot' } } }

  # ───────── 进程 ─────────
  /api/v1/processes:
    get:
      tags: [processes]
      summary: 进程列表（Top N by CPU）
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [cpu, mem], default: cpu } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/Process' } } } }

  /api/v1/processes/{pid}/kill:
    post:
      tags: [processes]
      summary: 发送信号（禁止 pid 1 与面板自身）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: pid, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/KillRequest' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { killed: { type: integer }, signal: { type: string } } } } } } } }
        '400': { description: 非法 pid 或未知信号 }
        '403': { description: 拒绝杀 pid 1 / 面板自身 }

  # ───────── 服务 ─────────
  /api/v1/services:
    get:
      tags: [services]
      summary: 服务列表
      parameters:
        - { name: filter, in: query, schema: { type: string }, description: 名称/描述模糊匹配 }
        - { name: managed_only, in: query, schema: { type: boolean }, description: 仅返回面板托管的服务 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/ServiceUnit' } } } }

  /api/v1/services/{unit}:
    get:
      tags: [services]
      summary: 按单元名查单个服务（绕开 list，dead 服务也能查到）
      parameters: [{ name: unit, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/ServiceUnit' } } }
        '404':
          description: 单元不存在

  /api/v1/services/{unit}/status:
    get:
      tags: [services]
      parameters: [{ name: unit, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/ServiceStatus' } } }

  /api/v1/services/{unit}/start:
    post:
      tags: [services]
      summary: 启动
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: unit, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: ok } }
  /api/v1/services/{unit}/stop:
    post:
      tags: [services]
      summary: 停止
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: unit, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: ok } }
  /api/v1/services/{unit}/restart:
    post:
      tags: [services]
      summary: 重启
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: unit, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: ok } }

  /api/v1/services/{unit}/enabled:
    put:
      tags: [services]
      summary: 开机自启开关
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: unit, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnabledRequest' } } } }
      responses: { '204': { description: ok } }

  /api/v1/services/{unit}/journal:
    get:
      tags: [services]
      summary: 服务日志（最近 N 行）
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string } }
        - { name: lines, in: query, schema: { type: integer, default: 500 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: string } } }

  /api/v1/services/{unit}/journal/stream:
    get:
      tags: [services]
      summary: 服务日志跟随（SSE；先补最近 N 行历史，再 journalctl -f 增量）
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string } }
        - { name: lines, in: query, schema: { type: integer, default: 200, description: 补读的历史行数（上限 2000） } }
      responses:
        '200':
          description: 'text/event-stream；事件名 log，data 为 { line }'
          content:
            text/event-stream:
              schema: { type: string }
        '10009': { description: 当前环境不支持服务管理 }

  /api/v1/services/{unit}/config:
    get:
      tags: [services]
      summary: 读取服务配置（unit=单元文件本体 / dropin=override.conf）
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string } }
        - { name: target, in: query, schema: { type: string, enum: [unit, dropin], default: unit } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/ServiceConfig' } } }
        '10009': { description: 该平台/单元不支持配置编辑 }
    put:
      tags: [services]
      summary: 写回配置并 daemon-reload（可选重启）；target=dropin 时写 override.conf
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: unit, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                restart: { type: boolean, default: false }
                target: { type: string, enum: [unit, dropin], default: unit, description: 写入目标；非法值 400，不静默回退 }
      responses:
        '200': { description: 已保存并重新加载 }
        '10009': { description: 该平台/单元不支持配置编辑 }

  # ───────── 软件包 ─────────
  /api/v1/packages:
    get:
      tags: [packages]
      summary: 已探测软件（名称/版本/路径）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { packages: { type: array, items: { $ref: '#/components/schemas/Package' } }, catalog: { type: array, items: { $ref: '#/components/schemas/PackageCatalog' } } } } } }
  /api/v1/packages/install:
    post:
      tags: [packages]
      summary: 安装（任务化 → 202）
      description: |
        已装包再传版本即等价于升级。若目标跨主版本（如 PostgreSQL 17→18、Node.js 20→24）
        且未带 confirm_major=true，会与 /packages/upgrade 共用同一守卫返回 409 强制二次确认
        ——不能只靠前端拦截，否则换端点即可绕过警告。未装包时 current 取不到 → 不触发，
        首次安装零影响。
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, version: { type: string, description: "可选，指定要安装的版本；留空=仓库最新版" }, confirm_major: { type: [boolean, "null"], description: 跨主版本升级的二次确认标记；检测到跨主版本且为 false/省略时接口返回 409 } } }
      responses:
        '202': { description: 已入队, content: { application/json: { schema: { $ref: '#/components/schemas/TaskAccepted' } } } }
        '409': { description: 跨主版本升级需二次确认（detail.kind=major_upgrade，附 from/to/note）；前端弹窗确认后带 confirm_major=true 重发 }
        '80001': { description: 队列满 }
  /api/v1/packages/{name}/versions:
    get:
      tags: [packages]
      summary: 查询该包在软件源里可供安装的版本（新→旧；空=查不到，按最新版安装）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  versions: { type: array, items: { type: string }, description: 为空表示查不到可用版本，安装时按仓库最新版处理 }
                  installed: { type: [string, "null"], description: 当前已安装版本（由包管理器给出）；未安装为 null，用于在下拉里标注 }
  /api/v1/packages/upgradable:
    get:
      tags: [packages]
      summary: 探测白名单内已安装且源里有新版的包（只读；空=无可升级项，非错误）
      description: |
        对白名单包跑一次 `apt-cache policy`，取每包**版本表最高版**（跨源，系统源/官方源
        谁高新取谁）与 `Installed` 版本比对（dpkg 对齐的版本比较），高于已装即视为有更新，再映射回逻辑名。
        刻意不用 `apt list --upgradable`：其判据 apt 的 Candidate 会被 pin / 源优先级压低，
        一旦低于已安装版本就永远不报更新（即便官方源已有更高版）。与安装弹窗默认选中项同源（versions[0]）。
        刻意不并入 GET /packages（后者是页面/轮询高频调用，本端点要跑一次秒级子进程）。
        探测失败返回空列表而非报错——探测是锦上添花，不该让整页软件列表挂掉。
      security: [cookieAuth, csrfHeader]
      responses:
        '200':
          description: 可升级清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: 仅含白名单内可升级的包；为空表示当前无可升级项
                    items:
                      type: object
                      properties:
                        name: { type: string, description: 逻辑包名（与 GET /packages 的 name 同域，UI 按它匹配已安装卡片） }
                        label: { type: string, description: 品牌展示名 }
                        current: { type: string, description: 当前已安装版本 }
                        candidate: { type: string, description: 可升级到的版本（版本表最高版，跨源） }
                        major: { type: boolean, description: 是否跨主版本升级（current 与 candidate 首段数字不同）；跨主版本可能不向后兼容，需数据迁移，前端据此弹窗二次确认 }
        '501': { description: 本机无可用包管理器（能力位 package.upgrade 不支持） }
  /api/v1/packages/upgrade:
    post:
      tags: [packages]
      summary: 升级到指定版本（任务化 → 202；不传 version = 升到源里最新版）
      description: |
        底层复用 `install pkg=version` 路径——apt/dnf 语义上「已装 1.0 时
        install pkg=1.2.3」本就是覆盖升级，故不另立 PkgOp::Upgrade。
        幂等键与 install 独立（pkg.upgrade: vs pkg.install:），避免「装完新版再
        手动回退到旧版」被 install 的窗口期幂等静默吞掉。
        **跨主版本升级强制二次确认**：检测到 current 与 candidate 跨主版本
        （如 PostgreSQL 17→18、Node.js 20→24）且请求未带 confirm_major=true 时，
        返回 409（detail.kind=major_upgrade，附 from/to/note），前端须弹窗确认后
        带 confirm_major=true 重发——不能只靠前端拦截，否则直接调 API 即可绕过警告。
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 逻辑包名；非白名单一律 400 }
                version: { type: [string, "null"], description: 目标版本；省略/null 表示升到源里最新版 }
                confirm_major: { type: [boolean, "null"], description: 跨主版本升级的二次确认标记；检测到跨主版本且为 false/省略时接口返回 409 }
      responses:
        '202': { description: 已入队 }
        '400': { description: 包不在白名单，或版本号含非法字符 }
        '409': { description: 跨主版本升级需二次确认（detail.kind=major_upgrade，附 from/to/note）；前端弹窗确认后带 confirm_major=true 重发 }
        '501': { description: 本机无可用包管理器（能力位 package.upgrade 不支持） }
  /api/v1/packages/{name}:
    delete:
      tags: [packages]
      summary: 卸载（任务化 → 202）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { '202': { description: 已入队 } }
  /api/v1/packages/{name}/hold:
    post:
      tags: [packages]
      summary: 设置/取消升级钉住（apt-mark hold/unhold；非 apt 管理器 501）
      description: |
        只挡 `apt-get upgrade`/`full-upgrade` 的**自动**升级，不挡显式
        `apt-get install <pkg>=<version>`——防误升，不是安全边界，前端文案须同步说清。
        幂等：重复 hold/unhold 同一包返回成功，不报错。
        包名限白名单（面板以 root 运行）；非 apt 管理器（dnf versionlock 是插件、
        apk 无对应概念）返回 501(10009) 而不是伪造成功。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [held], properties: { held: { type: boolean, description: true=钉住；false=取消 } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, properties: { name: { type: string, description: 逻辑包名 }, held: { type: boolean, description: 操作后的状态（回显请求值） } } } } } }
        '10009': { description: 当前包管理器不支持 hold（非 apt） }

  # ───────── 站点 / SSL ─────────
  /api/v1/sites:
    get:
      tags: [sites]
      summary: 站点列表
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/Site' } } } }
    post:
      tags: [sites]
      summary: 新建站点（写入站点定义；要求本机已有 Web 服务器底座）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SiteCreate' } } } }
      responses: { '201': { description: 已创建（此时站点尚未对外服务，需一次 apply，或在编辑页打开 enabled） }, '400': { description: 参数非法 }, '501': { description: '本机未接入 Web 服务器（webserver.manage 为 no，例如未安装 nginx）：拒绝建站，以免产生永远打不开的站点' } }
  /api/v1/sites/root:
    get:
      tags: [sites]
      summary: 站点托管根目录（只读；前端「选择目录」的初始定位）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { site_root: { type: string } } } } }
  /api/v1/sites/apply:
    post:
      tags: [sites]
      summary: 应用站点配置（配置闭环：render→validate→deploy→reload→落库）
      description: |
        手动维护（manual_conf=1）的站点缺省**整段跳过渲染/下发**（保护手改内容，表单仅入库）；
        显式 regen_conf=true 才按本次表单重新渲染覆盖（覆盖前自动备份到 <data_dir>/conf-backups/），
        成功后清零 manual 标记。custom_conf 仅 owner 可改（非 owner 提交即 403）。下发的配置内容
        自动进入历史版本链（source=apply，与最新版相同则去重）。成功响应 data 含：manual（是否走了
        跳过路径）、regenerated（本次是否重新生成）、backup（覆盖前备份路径，可为 null）、deployed / reloaded。
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SiteApply' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '40002': { description: 配置校验失败（已回滚，旧配置原封不动） }
  /api/v1/sites/{id}:
    get:
      tags: [sites]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/Site' } } } } } } }
    patch:
      tags: [sites]
      summary: 更新站点（enabled 翻转时真正同步 Web 服务器配置：停用=摘配置+reload）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SitePatch' } } } }
      responses: { '204': { description: ok }, '502': { description: 配置已写入但 reload 失败（30000；此时库未改动，站点状态保持原样） } }
    delete:
      tags: [sites]
      summary: 删除站点（可选保留根目录）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: ok } }
  /api/v1/sites/{id}/remark:
    patch:
      tags: [sites]
      summary: 更新站点说明（对象备注，022）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { remark: { type: string, description: 备注内容，≤500 字 } } } } } }
      responses: { '204': { description: ok } }
  /api/v1/apps:
    get:
      tags: [apps]
      summary: 应用列表（含 systemd 状态；探测失败时该项 state 为 null）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/App' } } } }
    post:
      tags: [apps]
      summary: 新建应用（渲染 systemd 单元 + 自动建反向代理站点）
      description: |
        面板只负责把进程按 systemd 拉起；**构建与依赖安装仍需用户在 workdir 自行完成**
        （runtime 的 build_hint 仅作提示，面板不执行）。
        启用态会依次：安装单元 → `sites/apply` 建反代站点 → 落库。
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppCreate' } } } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/App' } } }
        '400': { description: 校验失败（detail.field 指明字段） }
        '409': { description: 同名应用已存在 }
  /api/v1/apps/catalog:
    get:
      tags: [apps]
      summary: 受支持运行时目录（前端下拉的**唯一**数据源，勿在前端另硬编码一份）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { runtimes: { type: array, items: { $ref: '#/components/schemas/AppRuntimeInfo' } } } } } }
  /api/v1/apps/{id}:
    get:
      tags: [apps]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/App' } } }
        '404': { description: 应用不存在 }
    patch:
      tags: [apps]
      summary: 更新应用（enabled 切到 false 时撤下站点并删除单元文件）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppPatch' } } } }
      responses: { '200': { description: ok }, '400': { description: 校验失败 }, '404': { description: 应用不存在 } }
    delete:
      tags: [apps]
      summary: 删除应用（顺序：撤站点 → 停单元 → 删单元文件 → 删库行）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: ok }, '404': { description: 应用不存在 } }
  /api/v1/apps/{id}/act:
    post:
      tags: [apps]
      summary: 启停/重启单元（act=start|stop|restart；stop 不删单元文件）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [act]
              properties: { act: { type: string, enum: [start, stop, restart] } }
      responses: { '200': { description: ok }, '400': { description: 不支持的 act } }
  /api/v1/sites/{id}/reload:
    post:
      tags: [sites]
      summary: 重新生成配置并 reload（先 nginx -t 校验）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: ok } }
  /api/v1/sites/{id}/conf:
    get:
      tags: [sites]
      summary: 读取站点当前的 Web 服务器配置文件（路径取落库 conf_path，不接受前端指定路径）
      description: |
        路径唯一来源是落库的 conf_path（由 apply/patch 写入），避免「读任意文件」的越权面。
        从未下发、或文件已被外部删除时 content=null（不报 404——弹窗按「暂无内容」展示）。
        成功响应 data：path（落盘路径，可为 null）、content（文件原文，可为 null）、manual（是否手动维护）、
        stale（表单与文件是否已分叉，见 Site.conf_stale）、external（磁盘内容 vs 最后留档版本：文件在面板之外被改过）。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { path: { type: [string, "null"] }, content: { type: [string, "null"] }, manual: { type: boolean }, stale: { type: boolean }, external: { type: boolean, description: "外部修改（020）：磁盘内容与最后一次留档的版本不一致——文件在面板之外被改过" } } } } }
        '404': { description: 站点不存在 }
    put:
      tags: [sites]
      summary: 保存站点原始配置（nginx -t 校验 → 原子替换 → reload；成功后置「手动维护」；仅 owner）
      description: |
        顺序与 apply 一致：先 nginx -t 校验（独立 wrapper，不触碰线上配置）——失败返回 40002 并带
        原始 stderr，旧文件纹丝不动；通过才原子替换并 reload。成功后站点置 manual_conf=1，表单
        「保存并应用」不再覆盖该文件（可经 conf/restore 恢复面板托管）。站点停用（配置未下发）时拒绝编辑。
        写入内容自动进入历史版本链（source=manual；与最新版相同则去重）。
        成功响应 data：path、manual（true）、stale（false——此刻文件已对齐表单）、reloaded（true）。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, description: "完整配置片段（与落盘文件同构，含 server / map 等 http 上下文）；非空且不超过 1 MiB" }
      responses:
        '200': { description: ok }
        '400': { description: 校验失败（返回 nginx -t 原始 stderr）或内容为空/超限或站点已停用 }
        '403': { description: 仅 owner 可编辑原始配置 }
        '404': { description: 站点不存在 }
        '501': { description: 无 Web 服务器底座（webserver.manage） }
  /api/v1/sites/{id}/conf/restore:
    post:
      tags: [sites]
      summary: 恢复面板托管（按表单规格重新渲染覆盖手动内容，清零 manual_conf；仅 owner）
      description: |
        与 patch 的「重新启用下发」同一渲染路径（render_spec_for_row，自带 nginx -t 校验），
        丢弃手工内容。停用站点没有配置文件可恢复——仅清零标记（下次启用按表单渲染）。
        成功响应 data：path、manual（false）、stale（false）、deployed、reloaded、backup（覆盖前的手改备份路径，可为 null）。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok }
        '403': { description: 仅 owner }
        '404': { description: 站点不存在 }
        '501': { description: 无 Web 服务器底座（webserver.manage） }
  /api/v1/sites/{id}/conf/versions:
    get:
      tags: [sites]
      summary: 配置历史版本列表（最新在前，每站保留 20 版）
      description: |
        四个写入口自动留档：apply（表单下发）/ regen（按表单重新生成）/ manual（手动保存）/ rollback（回滚）。
        与最新版内容相同（hash 相等）的写入不重复留档；写入后立即裁剪到最新 20 版。
        current = 该版本内容是否与磁盘当前文件一致（文件缺失/未下发时全部 false）。
        成功响应 data：items（数组，元素为 {id, hash, source, operator, created_at, size, current}）。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok }
        '404': { description: 站点不存在 }
  /api/v1/sites/{id}/conf/versions/{vid}:
    get:
      tags: [sites]
      summary: 单个历史版本的正文（回滚前预览）
      description: 版本必须属于该站点（`AND site_id` 校验；跨站读取返回 404）。成功响应 data：id、content、hash、source、operator、created_at。
      security: [cookieAuth, csrfHeader]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: vid, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
        '404': { description: 站点或版本不存在 }
  /api/v1/sites/{id}/conf/rollback:
    post:
      tags: [sites]
      summary: 回滚到指定历史版本（nginx -t 校验 → 现场留档 → 原子替换 → reload；仅 owner）
      description: |
        顺序与 conf PUT 相同：先 nginx -t 校验（失败返回 40002 + 原始 stderr，旧文件纹丝不动），
        通过才把磁盘当前内容留档（source=rollback，外部手改也由此获得可回溯记录）→ 原子替换 → reload。
        自动定态：版本指纹 == 当前表单指纹 ⇒ 回「面板托管」（stale=false）；否则转「手动维护」
        （stale=true，如实报告）。站点停用（配置未下发）时拒绝。
        成功响应 data：path、manual、stale、deployed、reloaded、restored_from（本轮恢复的版本 id）。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id]
              properties:
                version_id: { type: integer, description: 目标版本 id（site_conf_versions.id，必须属于该站点） }
      responses:
        '200': { description: ok }
        '400': { description: 校验失败（返回 nginx -t 原始 stderr）或站点已停用 }
        '403': { description: 仅 owner }
        '404': { description: 站点或版本不存在 }
        '501': { description: 无 Web 服务器底座（webserver.manage） }
  /api/v1/sites/{id}/logs:
    get:
      tags: [sites]
      summary: 站点访问/错误日志（SSE，kind=access|error）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string, enum: [access, error] } }
        - { name: filter, in: query, schema: { type: string }, description: 关键词过滤 }
        - { name: limit, in: query, schema: { type: integer }, description: 回溯行数上限 }
      responses: { '200': { description: text/event-stream } }
  /api/v1/sites/{id}/log/download:
    get:
      tags: [sites]
      summary: 下载站点独立日志（021，kind=access|error）
      description: |
        cookie 认证（无需 CSRF，与根证书下载同范式）。站点未开启对应独立日志时返回 400 并说明原因；
        已开启但日志文件尚未生成（站点还没有请求）返回 400 提示先产生访问。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string, enum: [access, error] }, description: 日志类型，默认 access }
      responses:
        '200':
          description: 日志文本（text/plain; charset=utf-8，附件名 <站点名>-<access|error>.log）
          content: { text/plain: { schema: { type: string, format: binary } } }
        '400': { description: 站点未开启独立日志 / 日志文件尚未生成 }
        '401': { description: 未登录 }
        '404': { description: 站点不存在 }
  /api/v1/sites/{id}/log/clear:
    post:
      tags: [sites]
      summary: 清空站点独立日志（021，kind=access|error）
      description: |
        截断而非删除：删除会让正在写入的 nginx worker 继续往已 unlink 的 inode 写（磁盘不释放、文件"失踪"），
        截断才是运维上的正确做法。写操作需要 CSRF。
      security: [cookieAuth, csrfHeader]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [access, error], description: 日志类型，默认 access }
      responses:
        '200': { description: 已截断（返回 path） }
        '400': { description: 站点未开启独立日志 }
        '401': { description: 未登录 }
        '403': { description: 缺少 CSRF 令牌 }
        '404': { description: 站点不存在 }
  /api/v1/sites/{id}/ssl/apply:
    post:
      tags: [sites]
      summary: 申请证书（self-signed 同步完成 → 200；ACME 任务化 → 202；无 Web 服务器 → 501）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SslApply' } } } }
      responses:
        '200': { description: 自签证书已签发并落盘（含 cert_path / not_after / days_left） }
        '202': { description: ACME 申请已入队 }
        '501': { description: 无 Web 服务器底座（webserver.manage）时不签发——证书没有进程可加载，只会造成「已配置」却不生效的假象 }

  /api/v1/ssl/ca:
    get:
      tags: [sites]
      summary: 下载面板本地根证书（ca.crt）
      description: |
        自签证书（method=self-signed）的 leaf 全部由面板本地根 CA 签发；浏览器只信任已安装的根 CA，
        所以「自签证书打不开 HTTPS」的解法是——下载本证书并导入系统/浏览器信任库一次，
        此后全部本地 HTTPS 站点都不再报「非私密连接」。仅返回证书，绝不返回私钥（ca.key 始终留在服务器）。
      responses:
        '200':
          description: 根证书（application/x-x509-ca-cert，附件名 forkpanel-local-ca.crt）
          content:
            application/x-x509-ca-cert:
              schema: { type: string, format: binary }
        '401': { description: 未登录 }
  /api/v1/certs:
    get:
      tags: [sites]
      summary: 证书列表（含到期倒计时）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/Cert' } } } }
  /api/v1/certs/{id}/renew:
    post:
      tags: [sites]
      summary: 手动续期（自签同步 → 200；ACME 任务化 → 202；无 Web 服务器 → 501）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: 自签证书已重新签发 }
        '202': { description: ACME 续期已入队 }
        '501': { description: 无 Web 服务器底座（webserver.manage）时不续期 }
  /api/v1/certs/{id}/auto-renew:
    patch:
      tags: [sites]
      summary: 开关证书自动续期（仅 ACME 证书有效；后台每日扫描 30 天内到期者入队续期）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean, description: 是否允许到期前自动续期 } } }
      responses:
        '200': { description: '已更新（返回 { id, auto_renew }）' }
        '400': { description: 非 ACME 证书不支持自动续期 }
        '404': { description: 证书不存在 }
        '501': { description: 平台未接入 ACME 能力 }
  /api/v1/certs/{id}:
    delete:
      tags: [sites]
      summary: 删除证书
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: ok } }
  /api/v1/certs/renew-sweep:
    get:
      tags: [sites]
      summary: 证书自动续期扫描的运行状态（上次/下次扫描时间）
      security: [cookieAuth]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    type: object
                    required: [last_at, last_queued, next_at]
                    properties:
                      last_at:     { type: integer, description: 最近一次扫描的 Unix 秒；0=从未运行 }
                      last_queued: { type: integer, description: 该次扫描入队的证书数 }
                      next_at:     { type: integer, description: 预计下次扫描的 Unix 秒；last_at=0 时为 0 }

  # ───────── 文件 ─────────
  /api/v1/files/list:
    get:
      tags: [files]
      summary: 文件列表（排序 + 隐藏文件开关；单次上限 1000，超限置 truncated）
      parameters:
        - { name: path, in: query, schema: { type: string }, description: 允许根内绝对/相对路径 }
        - { name: hidden, in: query, schema: { type: boolean, default: false }, description: 是否包含隐藏文件（以 . 开头） }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/FileList' } } }
        '50001': { description: 路径越界 }
  /api/v1/files/stat:
    get:
      tags: [files]
      summary: 单文件/目录元信息
      security: [cookieAuth]
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/FileStatOut' } } }
  /api/v1/files/upload:
    put:
      tags: [files]
      summary: 上传（body=原始字节 octet-stream；上限 min(100MB, 平台上限)；原子替换）
      description: |
        覆盖写：目标已存在则原子替换（provider 内部临时文件+rename）。
        body 超限返回 400；目标为目录返回 400；沙箱越界 50001。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/FileUploadResult' } } } } } } }
  /api/v1/files/multipart/init:
    post:
      tags: [files]
      summary: 开始分片上传（分片大小由服务端定档，客户端不得自选）
      description: |
        分片大小由服务端决定（见响应的 chunk_size）——让客户端自选等于让它决定面板的
        内存占用。目标路径在这一步就**先校验一次**：早失败，别等传完 10GB 才发现路径非法。
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, size]
              properties:
                path: { type: string, description: 最终落盘路径（完成时会重新走完整沙箱校验） }
                size: { type: integer, description: "总字节数；上限 10 GiB" }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/MultipartInit' } } }
        '400': { description: 大小为 0 / 超限 / 路径非法或命中敏感路径 }
  /api/v1/files/multipart/chunk:
    put:
      tags: [files]
      summary: 上传单个分片（非末片必须恰好 chunk_size）
      description: |
        严格校验分片大小：不符即 400。放过去只会在"合并后字节数不符"时才暴露，
        而那时已经白传了一整轮。
        **该路由挂在放宽了 body 上限的 router 上**——否则 4MB 分片会被 axum 默认的
        2MB 上限整片拒掉，表现为静默失败（实测踩过）。
      security: [cookieAuth, csrfHeader]
      parameters:
        - { name: upload_id, in: query, required: true, schema: { type: string } }
        - { name: index, in: query, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: ok }
        '400': { description: 下标越界 / 分片大小不符 / 会话不存在或不属于当前用户 }
  /api/v1/files/multipart/{id}:
    get:
      tags: [files]
      summary: 查询已上传分片（**断点续传就靠它**）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: upload_id }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/MultipartStatus' } } }
    delete:
      tags: [files]
      summary: 中止上传并清理分片（幂等：会话已不存在也返回 204）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses: { '204': { description: ok } }
  /api/v1/files/multipart/{id}/complete:
    post:
      tags: [files]
      summary: 合并分片并落盘（缺片则拒绝并**保留会话**，供续传）
      description: |
        缺片 → 400 且保留会话（清掉等于逼客户端重传全部）。
        合并前目标路径**重新走一遍沙箱**：meta.json 是磁盘上的普通文件，
        不因"是我们自己写的"就信任。合并后核对字节数，不符即删除目标并报错——
        宁可报错，也不留一个"大小不对但看起来正常"的文件。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/FileUploadResult' } } } } } }
        '400': { description: 缺片 / 路径非法 }
        '500': { description: 合并后字节数与声明不符（已放弃该次上传） }
  /api/v1/files/download:
    get:
      tags: [files]
      summary: 下载（octet-stream + attachment 头；上限同上传；目录 400）
      security: [cookieAuth]
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: application/octet-stream }
        '400': { description: 目录 / 超过大小上限 }
        '50001': { description: 路径越界 }
  /api/v1/files/read:
    get:
      tags: [files]
      summary: 文本读取（≤2MB，二进制拒绝）
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer }, description: 分块起点（大文件预览） }
        - { name: len, in: query, schema: { type: integer }, description: 本次读取长度 }
        - { name: text, in: query, schema: { type: boolean }, description: "强制按文本返回；二进制由服务端检测并拒绝" }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: string } } } } } } }
  /api/v1/files/write:
    put:
      tags: [files]
      summary: 保存文本（生成 .bak）
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [path, content], properties: { path: { type: string }, content: { type: string } } }
      responses: { '204': { description: ok } }
  /api/v1/files/mkdir:
    post:
      tags: [files]
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [path, name], properties: { path: { type: string }, name: { type: string } } } } } }
      responses: { '204': { description: ok } }
  /api/v1/files/delete:
    post:
      tags: [files]
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [path], properties: { path: { type: string } } } } } }
      responses: { '204': { description: ok } }
  /api/v1/files/trash:
    get:
      tags: [files]
      summary: 回收站列表（新 → 旧；最多 1000 条；元数据损坏的条目跳过且不删除）
      security: [cookieAuth, csrfHeader]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TrashEntry' } } } } } }
    post:
      tags: [files]
      summary: 移入回收站（软删除；先归档后删除，任一步失败即回滚）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [path], properties: { path: { type: string } } } } } }
      responses:
        '200':
          description: ok（返回该条目元数据）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/TrashEntry' } } }
  /api/v1/files/trash/restore:
    post:
      tags: [files]
      summary: 从回收站恢复（目标重新走沙箱校验；原位置已有同名文件则拒绝，绝不覆盖）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { restored: { type: string } } } } }
  /api/v1/files/trash/purge:
    post:
      tags: [files]
      summary: 彻底删除（给 id 删一条；不给则清空回收站。幂等）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { id: { type: [string, 'null'] } } } } } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { purged: { type: integer } } } } }
  /api/v1/files/rename:
    post:
      tags: [files]
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [path, name], properties: { path: { type: string }, name: { type: string } } } } } }
      responses: { '204': { description: ok } }
  /api/v1/files/chmod:
    post:
      tags: [files]
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [path, mode], properties: { path: { type: string }, mode: { type: string, example: "0644" } } } } } }
      responses: { '204': { description: ok } }
  /api/v1/files/action:
    post:
      tags: [files]
      summary: 批量动作（move/copy/delete/trash/chmod；逐项执行逐项报告）
      description: |
        move/copy：dest 为**目标目录**，各 path 移入同名；目标已存在 → 该项失败（不静默覆盖）。
        delete：**永久**递归删除（目录也允许，前端须二次确认）。
        trash：移入回收站（可从 `/files/trash/restore` 恢复；归档或删除任一步失败即回滚）。
        chmod：八进制 ≤777。
        部分失败整体仍 200，结果数组逐项带 error；op/dest/mode 非法 → 400。
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FileAction' } } } }
      responses:
        '200':
          description: 逐项结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/FileActionResult' } } }

  # ───────── 数据库 ─────────
  /api/v1/db/connections:
    get:
      tags: [db]
      summary: 数据库引擎连接列表
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/DbConnection' } } } }
    post:
      tags: [db]
      summary: 新增连接（口令主密钥加密存储）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DbConnectionCreate' } } } }
      responses: { '201': { description: 已创建 } }
  /api/v1/db/connections/{id}:
    patch:
      tags: [db]
      summary: 更新数据库连接（写需 db.manage；字段缺省保留现值，口令留空=不修改）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string, description: 连接名 }, engine: { type: string, enum: [mysql, postgres, sqlite], description: 引擎 }, host: { type: string, description: 主机 }, port: { type: integer, description: 端口 }, user: { type: string, description: 账号（mysql/postgres 必填） }, password: { type: string, description: 口令，留空=不修改 }, default_db: { type: string, description: 默认库（sqlite 为 .db 文件路径） } } } } } }
      responses: { '200': { description: ok }, '400': { description: 校验失败 }, '404': { description: 连接不存在 }, '409': { description: 连接名已存在 } }
    delete:
      tags: [db]
      summary: 删除数据库连接（写需 db.manage；仅删面板登记，不动真实库/文件）
      security: [cookieAuth, csrfHeader]
      responses: { '200': { description: ok }, '404': { description: 连接不存在 } }
  /api/v1/db/{conn}/databases:
    get:
      tags: [db]
      parameters: [{ name: conn, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { type: string } } } } } } } }
  /api/v1/db/{conn}/{db}/schemas:
    get:
      tags: [db]
      summary: 「库」的下一级（PostgreSQL → schema；MySQL/SQLite → 空数组）
      description: |
        三个引擎的「库」**不是同一种东西**：MySQL 的库下一级就是表，
        PostgreSQL 的库下还有 schema，SQLite 的「库」其实是 attach 的 catalog
        （面板连单个文件，通常只有 main）。
        返回空数组表示「该引擎没有比『库』更下一层」——与「这一层是空的」不是一回事。
      parameters:
        - { name: conn, in: path, required: true, schema: { type: integer } }
        - { name: db, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/DbSchema' } } } } } } } }
  /api/v1/db/{conn}/{db}/tables:
    get:
      tags: [db]
      parameters:
        - { name: conn, in: path, required: true, schema: { type: integer } }
        - { name: db, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/DbTable' } } } } } } } }
  /api/v1/db/{conn}/{db}/{table}/rows:
    get:
      tags: [db]
      summary: 数据预览（只读，分页 50 行）
      parameters:
        - { name: conn, in: path, required: true, schema: { type: integer } }
        - { name: db, in: path, required: true, schema: { type: string } }
        - { name: table, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { description: ok } }
  /api/v1/db/{conn}/{db}/{table}/export:
    get:
      tags: [db]
      summary: 全量表数据导出为 CSV（只读）
      description: |
        与 `rows` 分开成路径而不是加 `?format=csv`：两者响应体一个 JSON 一个
        text/csv，混在一个端点上契约说不清。

        三个刻意的编码决定，都与"用户拿什么软件打开"有关：
        - **UTF-8 BOM**：Excel / WPS 在 Windows 上按本地代码页猜编码，无 BOM 的
          UTF-8 中文会变乱码；
        - **CRLF 行尾**（RFC 4180）：Excel 对裸 LF 的兼容历来不稳定；
        - **公式注入防护**：以 `=` `+` `@` 或制表符开头的字段加 `'` 前缀，
          否则表格软件会把单元格当公式执行。`-` 刻意不防——`-12.5` 这类负数远比
          `-1+1` 这类公式常见，一刀切会把正常负数全变成文本。

        NULL 渲染为空串：客户端模式下 NULL 与空串本就无法区分（见 `rows`），
        这里不伪造第三种表示。

        **超限时拒绝而非截断**：上限 20000 行，多取一行作哨兵，真有第 N+1 行
        就整体 400。静默给一个"看起来完整"的前 N 行文件比明确失败危险得多——
        用户会拿它对账、导入，而缺了哪几行无从得知。请用 SQL 控制台加 WHERE
        收窄，或用数据库客户端导出。
      parameters:
        - { name: conn, in: path, required: true, schema: { type: integer } }
        - { name: db, in: path, required: true, schema: { type: string } }
        - { name: table, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: CSV 文件（text/csv，带 UTF-8 BOM 与 CRLF 行尾）
          content:
            text/csv:
              schema: { type: string }
        '400': { description: 超过 20000 行导出上限，或标识符非法 }
  /api/v1/db/{conn}/query:
    post:
      tags: [db]
      summary: 只读 SQL 查询（SQLite 与 PostgreSQL）
      description: |
        校验分两层：首关键词白名单（SELECT/WITH/EXPLAIN/PRAGMA/VALUES）
        + 写关键词黑名单（拦 `WITH … DELETE` 这类「首词合法、后面在写」的语句）。
        注释与引号串内的内容不参与判定（先 scrub 再判）。

        **白名单不是兜底**，物理兜底在 provider 层：
        - SQLite：连接以只读模式打开（`SQLITE_OPEN_READ_ONLY`），写语句必然失败；
        - PostgreSQL：会话设 `default_transaction_read_only=on`，写语句在服务端失败
          （实测 CREATE TABLE / UPDATE / SELECT INTO 全被拦），并用
          `SELECT * FROM (<sql>) AS __panel_readonly LIMIT n` 包裹以给出真实行数上界
          （`EXPLAIN` 不可包裹，豁免）。残余风险：`pg_reload_conf()` 这类超级用户
          函数照样执行，诚实记录、不假装全拦。
        - MySQL：返回 501 —— 没有等价的服务端只读护栏，不写未测代码。

        另有两处已知边界（均为**可见报错**而非静默错数据）：PG 美元引用 `$$…$$`
        内的分号会被误判成多语句；`SELECT 1; -- 尾注释` 会因括号内残留分号报语法错误。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: conn, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:   { type: string, description: 单条只读语句 }
                limit: { type: integer, minimum: 1, maximum: 2000, default: 200, description: 返回行数上限 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { columns: { type: array, items: { type: string } }, rows: { type: array, items: { type: array, items: { type: [string, 'null'] } } }, truncated: { type: boolean }, limit: { type: integer } } } } }
        '400': { description: 写操作 / 多语句 / 超长语句 }
        '501': { description: MySQL（无服务端只读护栏） }
  /api/v1/db/{conn}/sql-meta:
    get:
      tags: [db]
      summary: SQL 控制台元数据（能力位 + 引擎相关的默认语句与示例）
      description: |
        与 `/query` 分开成两个路径：它回答「这个连接能不能自己写 SQL、该从哪句
        开始」，后者回答「执行这一条」。示例 SQL 是引擎知识（`sqlite_master` vs
        `information_schema`），由后端单点下发，前端不存任何引擎判断。
      security: [cookieAuth]
      parameters: [{ name: conn, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/SqlConsoleMeta' } } }

  /api/v1/db/{conn}/backup:
    post:
      tags: [db]
      summary: 备份（任务化 → 202）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: conn, in: path, required: true, schema: { type: integer } }]
      responses: { '202': { description: 已入队 } }
  /api/v1/db/{conn}/remark:
    patch:
      tags: [databases]
      summary: 更新数据库连接说明（对象备注，022）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: conn, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { remark: { type: string, description: 备注内容，≤500 字 } } } } } }
      responses: { '204': { description: ok } }
  /api/v1/db/{conn}/restore:
    post:
      tags: [db]
      summary: 还原（二次确认 + 自动先备份当前库）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: conn, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [file, confirm_token], properties: { file: { type: string }, confirm_token: { type: string } } } } } }
      responses: { '202': { description: 已入队 } }

  # ───────── 备份计划（本地） ─────────
  /api/v1/backups:
    get:
      tags: [backups]
      summary: 备份计划列表
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/BackupPlan' } } } }
    post:
      tags: [backups]
      summary: 新建备份计划
      description: |
        `remote`（可选）配置远端副本。启用远端时**在创建时就把全部字段校验完**——
        地址 / 协议 / bucket / 凭据配对任何一处不对即 400，不会留到第一次执行时才在后台报错。
        凭据落库前用主密钥（/var/lib/forkpanel/master.key）AES-256-GCM 加密，**永不回读**。
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target, dest_dir]
              properties:
                kind:       { type: string, enum: [panel, site, db], description: "db 时 target 为连接名（见 /db/connections）" }
                target:     { type: string, description: "panel 固定 'panel'；site 为站点名" }
                dest_dir:   { type: string, description: "相对面板 backup_dir 的子目录" }
                cron_expr:  { type: [string, "null"] }
                keep_count: { type: integer, default: 7 }
                enabled:    { type: boolean, default: true }
                encrypt:    { type: boolean, default: false }
                remote:     { $ref: '#/components/schemas/RemoteConfig' }
      responses: { '201': { description: 已创建 } }
  /api/v1/backups/test-remote:
    post:
      tags: [backups]
      summary: 远端连接自检（PUT 探针对象 → DELETE）
      description: |
        用**备份真正要用的操作**验证配置与凭据，而不是 HEAD / 列目录——
        存在 HEAD 通过但 PUT 被拒的存储。远端配置写错是最典型的静默失败
        （本地照常成功、远端一直 401），用户要等到出事才发现异地没有副本，
        所以这项配置必须能**当场验证**。探针落在一个固定对象名上，用完即删。
        校验逻辑与保存时**完全同一份**：测试通过而保存失败是最恼人的不一致。
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id: { type: integer, description: "复用该计划已存的凭据（前端不回显密文，否则只能逼用户重输一遍）" }
                remote:  { $ref: '#/components/schemas/RemoteConfig' }
      responses:
        '200': { description: 连接可用 }
        '400': { description: 配置非法（协议 / 地址 / bucket / 凭据配对） }
        '502': { description: "远端拒绝或不可达；curl 的 stderr 在 detail.stderr" }
  /api/v1/backups/system:
    get:
      tags: [backups]
      summary: 系统自动备份列表（面板库每日快照）
      description: |
        每日自动备份（`panel-<unix>.db`）此前**只写不列**：产物接口只认 `plan<id>-`
        前缀，用户完全看不到面板每天在备份、更不知道堆了多少。

        响应同时回 `keep` / `daily_backup`：**实际生效值**（config.toml `[db]`
        的 backup_keep / daily_backup），前端据此显示"保留 N 份"，不得写死默认 7。
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          dir: { type: string, description: 备份目录绝对路径 }
                          keep: { type: integer, description: "实际保留份数（config.toml [db] backup_keep，默认 7）" }
                          daily_backup: { type: boolean, description: "每日备份是否已启用（config.toml [db] daily_backup；nano 档位恒不执行）" }
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                name:  { type: string, description: "文件名（panel-<unix>.db）" }
                                size:  { type: integer, description: 字节数 }
                                mtime: { type: integer, description: 修改时间（unix 秒） }

  /api/v1/backups/system/{name}:
    get:
      tags: [backups]
      summary: 下载某份系统自动备份
      description: |
        流式返回（不把整份备份读进内存）。文件名白名单 `^panel-[0-9]+\.db$` +
        canonicalize 父目录校验，双重防路径逃逸。
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 二进制流（application/octet-stream） }
        '400': { description: 文件名非法 }
        '404': { description: 产物不存在 }

  /api/v1/backups/{id}:
    patch:
      tags: [backups]
      summary: 更新备份计划
      description: 各字段缺省 = 不改动；`remote` 的字段级语义见 `RemoteConfig`。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cron_expr:  { type: [string, "null"] }
                keep_count: { type: integer }
                dest_dir:   { type: string }
                enabled:    { type: boolean }
                encrypt:    { type: boolean }
                remote:     { $ref: '#/components/schemas/RemoteConfig' }
      responses: { '200': { description: ok } }
    delete:
      tags: [backups]
      summary: 删除备份计划（**不删产物**）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: ok } }
  /api/v1/backups/{id}/run:
    post:
      tags: [backups]
      summary: 立即执行备份（任务化 → 202）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '202': { description: 已入队 } }
  /api/v1/backups/{id}/artifacts:
    get:
      tags: [backups]
      summary: 该计划的产物列表
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/BackupArtifact' } } } }
  /api/v1/backups/{id}/artifacts/{name}:
    get:
      tags: [backups]
      summary: 下载某份计划产物
      description: |
        流式返回（不把整份产物读进内存）。文件名必须匹配 `plan<id>-` 前缀且只含
        `[A-Za-z0-9._-]`；再 canonicalize 父目录确认未逃出该计划的产物目录。
      parameters:
        - { name: id,   in: path, required: true, schema: { type: integer } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 二进制流（application/octet-stream） }
        '400': { description: 文件名非法 }
        '404': { description: 计划或产物不存在 }

  /api/v1/backups/{id}/remote/artifacts:
    get:
      tags: [backups]
      summary: 列远端副本（本地盘出事后唯一能问的地方）
      description: |
        直接向远端存储要清单（WebDAV PROPFIND / S3 ListObjectsV2），只返回名字
        以 `plan<id>-` 开头且通过白名单的对象。未配置远端时返回 400。
        注意：远端不可达时返回 5xx/4xx 而**不是空列表**——"列不出来"与
        "远端确实没有"是两件事，不能混。

        S3 的 ListObjectsV2 单次最多 1000 个对象，本接口会**自动翻页**
        （`continuation-token`）直到取完，上限约 5 万个；真超过上限时会在
        服务端日志告警，不会返回一个看着完整其实截断的列表。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400': { description: 该计划未配置远端副本 }
        '502': { description: 远端不可达 / 凭据被拒 }

  /api/v1/backups/{id}/restore:
    post:
      tags: [backups]
      summary: 从产物恢复（**高危**：确认词 + 产物名白名单 + 自动先备份当前态）
      description: >
        kind=site 可恢复；kind=panel 返回 501——面板库是面板自身运行中的库，
        在线覆盖会损坏 SQLite WAL，需停服后手动替换。任务内先打包当前态为
        safety-plan<id>-<ts>.tar.gz，output_path 指向该快照，可据此回滚。
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact, confirm_token]
              properties:
                artifact: { type: string, description: "产物文件名（取自 artifacts 列表），不接受路径" }
                confirm_token: { type: string, description: "二次确认词，须等于「覆盖恢复」" }
                from_remote:
                  type: boolean
                  default: false
                  description: >-
                    从远端副本恢复：先按名字把对象下载到临时文件（任务结束即删），
                    再走同一条恢复流程。本地那份已丢失时用这个——此时不要求本地产物存在。
                    仅 kind=site 可用（panel 仍 501）。
      responses:
        '202':
          description: 已入队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { task_id: { type: string } } } } }
        '400': { description: "确认词不符 / 产物名非法" }
        '501': { description: "kind=panel（面板库不可在线覆盖）" }

  # ───────── 容器（Docker）─────────
  #
  # 全组端点受能力位 `container.manage` 门禁：该位按 **daemon socket 可达性**判定
  # （不是二进制存在性）。不满足时统一返回 501，且 `detail.reason` 给出
  # `binary_missing` / `daemon_unreachable`，供前端直接显示可操作提示。
  /api/v1/containers:
    get:
      tags: [containers]
      summary: 容器列表（等价 `docker ps -a`，含已停止）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/ContainerSummary' } } } }
        '501': { description: "容器能力不可用（detail.reason：binary_missing / daemon_unreachable）" }
    post:
      tags: [containers]
      summary: 创建容器（`docker create`，**默认不启动**）
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, image, confirm_token]
              properties:
                name: { type: string }
                image: { type: string }
                cmd: { type: array, items: { type: string } }
                ports: { type: array, items: { type: string }, description: 'host:container[/proto]' }
                env: { type: array, items: { type: string }, description: 'KEY=VALUE' }
                volumes: { type: array, items: { type: string }, description: 'src:dst[:ro]' }
                restart: { type: string, enum: [no, on-failure, always, unless-stopped] }
                cpu_quota: { type: number, description: CPU 核数配额 }
                mem_limit: { type: string, description: '如 512m / 2g' }
                privileged: { type: boolean, description: '必须为 false（provider 拒绝 true）' }
                confirm_token: { type: string, description: '二次确认词，必须为「创建容器」' }
      responses:
        '200':
          description: 已创建（state=created，需再 start 才运行）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/ContainerSummary' } } }
        '400': { description: 校验失败（确认词错 / 特权 / 宿主敏感挂载 / 端口格式等） }
        '501': { description: 容器能力不可用 }
  /api/v1/containers/images:
    get:
      tags: [containers]
      summary: 镜像列表（等价 `docker images`，含悬空镜像）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/ContainerImage' } } } }
        '501': { description: 容器能力不可用 }
  /api/v1/containers/images/pull:
    post:
      tags: [containers]
      summary: 拉取镜像（等价 `docker pull`；可用来更新已有镜像）
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, description: '镜像引用 `repo:tag` 或 `repo`（默认 latest）；由后端校验无空白 / shell 元字符' }
      responses:
        '200':
          description: 已拉取（返回镜像摘要）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/ContainerImage' } } }
        '400': { description: 校验失败（镜像引用非法） }
        '501': { description: 容器能力不可用 }
  /api/v1/containers/install:
    post:
      tags: [containers]
      summary: 一键安装 Docker（仅当 docker 二进制缺失时可用）
      description: |
        高危系统变更：必须手输确认词「安装 Docker」，且走任务队列（可审计、可查进度）。
        按包管理器选引擎包名（apt=docker.io，dnf/yum=docker-ce，apk/zypper=docker）。
        本端点**只装引擎**，不自动把面板用户加入 docker 组——那等同授予 root 级权限，
        保留为用户显式决策（装完再走 join-docker-group）。
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_token]
              properties:
                confirm_token: { type: string, description: 必须为「安装 Docker」 }
      responses:
        '200': { description: 已入队，返回 task_id / created / package }
        '400': { description: 已安装或守护进程不可达（无需重装），或确认词不正确 }
  /api/v1/containers/{id}/remark:
    get:
      tags: [containers]
      summary: 读取容器备注（022，容器不入库，存 container_remarks 引用表）
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { remark: { type: string } } } } } } } } }
    patch:
      tags: [containers]
      summary: 更新容器备注（022）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { remark: { type: string, description: 备注内容，≤500 字 } } } } } }
      responses: { '204': { description: ok } }

  /api/v1/containers/{id}/logs:
    get:
      tags: [containers]
      summary: 读取容器日志（docker logs，只读最近 N 行快照，不带 --follow 避免阻塞）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；白名单校验，禁止以 `-` 开头（防参数注入）" }
        - { name: tail, in: query, schema: { type: integer }, description: "回显最近 N 行；默认 200，上限 2000" }
        - { name: timestamps, in: query, schema: { type: boolean }, description: "是否带 RFC3339 时间戳前缀（默认 false）" }
      responses:
        '200':
          description: ok，返回日志行数组（data 为 [{ ts?, text }]）
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { type: object, properties: { ts: { type: string, nullable: true, description: "RFC3339 时间戳，仅 timestamps=true 时存在" }, text: { type: string } } } } } } } }
        '400': { description: ID/名称非法 }
        '501': { description: 容器能力不可用 }

  /api/v1/containers/stats:
    get:
      tags: [containers]
      summary: 读取全部容器的资源用量快照（docker stats --no-stream --all，非流式）
      responses:
        '200':
          description: ok，返回每容器一行用量快照（data 为 [name, cpu_perc, mem_usage, mem_perc, net_io, block_io, pids]，均为 docker 格式化串）
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { type: object, properties: { name: { type: string }, cpu_perc: { type: string }, mem_usage: { type: string }, mem_perc: { type: string }, net_io: { type: string }, block_io: { type: string }, pids: { type: string } } } } } } } }
        '501': { description: 容器能力不可用 }
  /api/v1/containers/networks:
    get:
      tags: [containers]
      summary: 列举 Docker 网络（docker network ls --no-trunc，只读）
      responses:
        '200':
          description: ok，返回每网络一行（data 为 [name, driver, scope, id]，均为 docker 原始串；id 为完整 64 位）
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { type: object, properties: { name: { type: string }, driver: { type: string }, scope: { type: string }, id: { type: string } } } } } } } }
        '501': { description: 容器能力不可用 }
  /api/v1/containers/volumes:
    get:
      tags: [containers]
      summary: 列举 Docker 卷（docker volume ls，只读）
      responses:
        '200':
          description: ok，返回每卷一行（data 为 [name, driver, mountpoint]，均为 docker 原始串；mountpoint 为宿主机路径）
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { type: object, properties: { name: { type: string }, driver: { type: string }, mountpoint: { type: string } } } } } } } }
        '501': { description: 容器能力不可用 }
  /api/v1/containers/compose:
    get:
      tags: [containers]
      summary: 列举 Docker Compose 项目（docker compose ls --all --format json，只读）
      responses:
        '200':
          description: ok，返回每项目一行（data 为 [name, status, config_files]；status 为组合语义串如 running(1) / exited(1)，config_files 为配置文件绝对路径）
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { type: object, properties: { name: { type: string }, status: { type: string }, config_files: { type: string } } } } } } } }
        '501': { description: "容器能力不可用，或 Compose 插件缺失（detail.reason：binary_missing / daemon_unreachable / compose_unavailable）。⚠ compose 是 CLI 插件，与 daemon 可达性无关：docker 可用但没装 docker-compose-plugin 时会返回 compose_unavailable（而非 502）" }
  /api/v1/containers/compose/{project}/act:
    post:
      tags: [containers]
      summary: 对 Compose 项目执行生命周期动作（up / stop / restart / down）
      description: |
        action ∈ {up, stop, restart, down}；down 必须手输项目名作为 confirm_token（防停错项目）。
        up 豁免「项目必须存在于 compose ls」（down 后项目消失、需要 up 重新拉起），其余动作要求项目真实存在。
        返回 2xx 仅表示动作已下发（compose 异步执行，实际状态以 /compose 列举为准）。
      security: [cookieAuth, csrfHeader]
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [up, stop, restart, down] }
                working_dir: { type: [string, "null"], description: "compose 工作目录（覆盖默认值）；省略则按服务器约定" }
                confirm_token: { type: [string, "null"], description: "down 动作必填：必须等于 project 名作为确认词" }
      responses:
        '200': { description: ok，已下发动作 }
        '400': { description: 未知 action / down 缺少确认词 }
        '404': { description: compose 项目不存在（stop / restart / down 要求项目真实存在） }
        '501': { description: 容器能力不可用，或 Compose 插件缺失 }
  /api/v1/containers/stacks:
    get:
      tags: [containers]
      summary: 列表面板创建的编排项目（Compose stack 定义）
      description: 只扫 `<data_dir>/compose-stacks/` 下带 `.forkpanel-compose.json` 的目录；不识别用户手写的 compose 项目。⚠ 本组端点不检查 docker 可用性——编排定义的读写与 daemon 无关。
      responses:
        '200':
          description: ok，data 为 ComposeStack 数组（按项目名排序）
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/ComposeStack' } } } } } }
  /api/v1/containers/stacks/{project}:
    get:
      tags: [containers]
      summary: 读取单个编排项目
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok，data 为 ComposeStack
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/ComposeStack' } } } } }
        '404': { description: 编排项目不存在 }
    put:
      tags: [containers]
      summary: 创建或更新编排项目（幂等），需 container.manage
      description: |
        写入 `.forkpanel-compose.json`（单一事实源）并渲染 `compose.yaml`。
        ⚠ 可写字段由服务端类型白名单限定：`privileged` / `cap_add` / `pid` /
        `network_mode` / `user` / `devices` 等字段**不存在**，不接受用户提交原始 YAML。
        ⚠ 已存在且 `compose.yaml` 被外部改过时返回 409，绝不静默覆盖用户修改。
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [services]
              properties:
                services: { type: array, items: { $ref: '#/components/schemas/ComposeStackService' } }
      responses:
        '200':
          description: ok，data 为落盘后的 ComposeStack
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/ComposeStack' } } } } }
        '400': { description: 校验失败（项目名/服务名/镜像/端口/挂载/环境变量/重启策略/资源限制） }
        '409': { description: compose.yaml 已被外部修改，拒绝覆盖 }
  /api/v1/containers/join-docker-group:
    post:
      tags: [containers]
      summary: 把面板进程用户加入 docker 组（修复 daemon_unreachable）
      description: |
        目标用户取**面板进程的 effective uid**（不是登录用户）——docker socket 权限取决于
        面板进程身份，加错人对管理容器毫无帮助。
        高危：docker 组等同 root 级权限（可借 docker 提权到宿主 root）。
        需 container.manage 权限 + 前端二次确认词；完成后需重启面板使新组生效。
      security: [cookieAuth, csrfHeader]
      responses:
        '200': { description: ok，返回 user 与命令输出 }
        '400': { description: 守护进程已可达，无需加组 }
        '30000': { description: usermod 执行失败（如面板非 root 运行） }
  /api/v1/containers/{id}/start:
    post:
      tags: [containers]
      summary: 启动容器
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器 ID 或名称；白名单校验，禁止以 `-` 开头（防参数注入）" }]
      responses:
        '204': { description: ok }
        '400': { description: ID/名称非法 }
        '501': { description: 容器能力不可用 }
  /api/v1/containers/{id}/stop:
    post:
      tags: [containers]
      summary: 停止容器（优雅停机 10s 后强制）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses:
        '204': { description: ok }
        '400': { description: ID/名称非法 }
        '501': { description: 容器能力不可用 }
  /api/v1/containers/{id}/restart:
    post:
      tags: [containers]
      summary: 重启容器
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses:
        '204': { description: ok }
        '400': { description: ID/名称非法 }
        '501': { description: 容器能力不可用 }
  /api/v1/containers/{id}:
    delete:
      tags: [containers]
      summary: 删除容器（默认 `docker rm`；运行中的容器会被拒绝，需先停止。`force=true` 走 `docker rm -f`）
      security: [cookieAuth, csrfHeader]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }
        - name: force
          in: query
          required: false
          schema: { type: boolean }
          description: "`true` 走 `docker rm -f`（先强制停止再移除）；默认 `false` 即 `docker rm`，运行中的容器会被守护进程拒绝"
      responses:
        '204': { description: ok }
        '400': { description: ID/名称非法 }
        '501': { description: 容器能力不可用 }

  # ───────── 防火墙 ─────────
  /api/v1/firewall/status:
    get:
      tags: [firewall]
      summary: 防火墙开关与后端
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/FirewallStatus' } } }
  /api/v1/firewall/enabled:
    put:
      tags: [firewall]
      summary: 开关（大按钮 + 二次确认防误关）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses: { '204': { description: ok } }
  /api/v1/firewall/rules:
    get:
      tags: [firewall]
      summary: 端口规则列表
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/FirewallRule' } } } }
    post:
      tags: [firewall]
      summary: 应用规则（声明式 RulePlan）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FirewallRuleCreate' } } } }
      responses: { '201': { description: 已创建 } }
  /api/v1/firewall/rules/{id}:
    delete:
      tags: [firewall]
      summary: 删除规则
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses: { '204': { description: ok } }

  /api/v1/firewall/fail2ban:
    get:
      tags: [firewall]
      summary: fail2ban 总览（可用性与各 jail 封禁统计）
      security: [cookieAuth, csrfHeader]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/Fail2banStatus' } } }
        '501': { description: fail2ban 不可用（未装 fail2ban-client） }
  /api/v1/firewall/fail2ban/jail:
    post:
      tags: [firewall]
      summary: 启停某 jail
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, enabled], properties: { name: { type: string }, enabled: { type: boolean } } }
      responses: { '200': { description: ok }, '501': { description: fail2ban 不可用 } }
  /api/v1/firewall/fail2ban/unban:
    post:
      tags: [firewall]
      summary: 解封某 jail 下指定 IP
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [jail, ip], properties: { jail: { type: string }, ip: { type: string } } }
      responses: { '200': { description: ok }, '501': { description: fail2ban 不可用 } }

  # ───────── 安全 ─────────
  /api/v1/security/baseline:
    get:
      tags: [security]
      summary: SSH / 系统安全基线检查（只读）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/SecurityBaselineItem' } } } }
  /api/v1/security/baseline/apply:
    post:
      tags: [security]
      summary: 应用某项基线修复（二次确认词 + 先备份 → 写 → sshd -t 校验 → 失败回滚）
      description: >
        仅支持 sshd 三项白名单；**sshd 不可用时拒绝修改**——宁可不修，
        也不写坏配置把人锁在服务器门外。响应回传备份路径，出事可据此回滚。
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, confirm_token]
              properties:
                key:
                  type: string
                  enum: [ssh.permit_root_login, ssh.password_auth, ssh.pubkey_auth]
                  description: "白名单；pubkey_auth 只能置 yes（置 no 会把所有人锁在门外）"
                confirm_token: { type: string, description: "二次确认词，须等于「确认修复」" }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/SecurityApplyResult' } } }
        '400': { description: "确认词不符 / 不支持的基线项 / sshd 不可用" }
  /api/v1/security/sessions:
    get:
      tags: [security]
      summary: 当前活跃会话（内存快照；重启即清零，如实行为）
      security: [cookieAuth]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { sessions: { type: array, items: { $ref: '#/components/schemas/SessionInfo' } }, total: { type: integer } } } } }
  /api/v1/security/sessions/{id}:
    delete:
      tags: [security]
      summary: 吊销会话（允许吊销自己的当前会话=自我登出）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses: { '204': { description: ok }, '404': { description: 会话不存在或已过期 } }

  # ───────── 计划任务 ─────────
  /api/v1/cron/jobs:
    get:
      tags: [cron]
      summary: 计划任务列表
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/CronJob' } } } }
    post:
      tags: [cron]
      summary: 新建（表达式服务端校验）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CronJobCreate' } } } }
      responses: { '201': { description: 已创建 }, '80002': { description: 表达式非法 } }
  /api/v1/cron/jobs/{id}:
    get:
      tags: [cron]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses: { '200': { description: ok } }
    patch:
      tags: [cron]
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, expr: { type: string }, timeout_sec: { type: integer } } } } } }
      responses: { '204': { description: ok } }
    delete:
      tags: [cron]
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses: { '204': { description: ok } }
  /api/v1/cron/jobs/{id}/run:
    post:
      tags: [cron]
      summary: 手动执行（任务化）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses: { '202': { description: 已入队 } }
  /api/v1/cron/jobs/{id}/webhook:
    post:
      tags: [cron]
      summary: 测试该任务已配置的 Webhook（POST 一条 test 事件）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses: { '200': { description: ok } }
  /api/v1/cron/jobs/{id}/runs:
    get:
      tags: [cron]
      summary: 执行记录（最近 100 条/任务）
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "容器名称或 ID；表按名称索引（ID 随重建变化，名称通常保留），不强制 Docker 可达" }]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/CronRun' } } } } } } } }
  /api/v1/cron/preview:
    post:
      tags: [cron]
      summary: 下次 5 次执行时间预览（本地时区语义；next 可为空 = 一年内无命中）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expr], properties: { expr: { type: string } } } } } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { expr: { type: string }, next: { type: array, items: { type: integer } } } } } }
  /api/v1/cron/webhook/test:
    post:
      tags: [cron]
      summary: 测试任意 Webhook URL 可达性（POST 一条 test 事件）
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string } } } } } }
      responses: { '200': { description: ok } }

  # ───────── 日志 ─────────
  /api/v1/logs/sources:
    get:
      tags: [logs]
      summary: 日志来源（panel/system/service/site-access/site-error/custom）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/LogSource' } } } }
  /api/v1/logs/stream:
    get:
      tags: [logs]
      summary: 统一日志浏览器（SSE，服务端过滤）
      parameters:
        - { name: source, in: query, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] } }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
        - { name: follow, in: query, schema: { type: boolean, default: true } }
        - { name: limit, in: query, schema: { type: integer, maximum: 2000, default: 200 } }
      responses: { '200': { description: text/event-stream } }
  /api/v1/logs/{id}/download:
    get:
      tags: [logs]
      summary: 日志下载（text/plain 附件；行数 ≤10_000 且累计 ≤8MB，超限 X-Capped:1）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 日志源 id }
        - { name: lines, in: query, schema: { type: integer }, description: 尾部行数（默认 2000，上限 10000） }
        - { name: grep, in: query, schema: { type: string }, description: 字面量子串过滤（非正则） }
        - { name: level, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: integer }, description: unix 秒，只返回其后日志 }
      responses:
        '200':
          description: ok
          headers:
            Content-Disposition: { schema: { type: string }, description: attachment; filename="<source>.log" }
          content:
            text/plain:
              schema: { type: string }

  /api/v1/logs/{id}/stats:
    get:
      tags: [logs]
      summary: 日志聚合统计（level 分布 + 时间直方图 + 高频消息模式）
      parameters:
        - $ref: '#/components/parameters/LogId'
        - { name: lines, in: query, schema: { type: integer, maximum: 2000, default: 2000 }, description: 扫描行数（统计默认扫满上限） }
        - { name: grep, in: query, schema: { type: string }, description: 字面量子串过滤（非正则） }
        - { name: level, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: integer } }
        - { name: buckets, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 12 }, description: 时间分桶数 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/LogStats' } } }

  /api/v1/logs/{id}:
    get:
      tags: [logs]
      summary: 读取单个日志源（行数上限 2000，grep 字面量非正则）
      parameters:
        - $ref: '#/components/parameters/LogId'
        - { name: lines, in: query, schema: { type: integer, maximum: 2000, default: 200 } }
        - { name: grep, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] } }
        - { name: since, in: query, schema: { type: integer } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/LogRead' } } }

  # ───────── 站内通知 ─────────
  #
  # 先做站内、不做邮件/Webhook：外部通道需 reqwest/lettre，各占一个直接依赖位，
  # 而依赖预算门禁 [8] 上限 38。站内通知零新增依赖，覆盖单机面板主要诉求。
  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: 通知列表（时间倒序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: unread_only, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/Notification' } } } }
  /api/v1/notifications/unread-count:
    get:
      tags: [notifications]
      summary: 未读条数（前端徽章用，单行聚合）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { count: { type: integer } } } } }
  /api/v1/notifications/read-all:
    post:
      tags: [notifications]
      summary: 全部标记已读
      security: [cookieAuth, csrfHeader]
      responses: { '200': { description: ok } }
  /api/v1/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: 单条标记已读
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok }
        '404': { description: 通知不存在 }
  /api/v1/notifications/{id}:
    delete:
      tags: [notifications]
      summary: 删除通知（需 system.manage）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok }
        '404': { description: 通知不存在 }

  # ───────── 任务中心 ─────────
  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: 任务列表（进行中/完成/失败）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/Task' } } } }
  /api/v1/tasks/{id}:
    get:
      tags: [tasks]
      summary: 单任务详情（含 duration_secs 派生字段；404 对不存在任务）
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/Task' } } } } } } }
  /api/v1/tasks/{id}/cancel:
    post:
      tags: [tasks]
      summary: 取消任务（任务体在检查点优雅退出，不强杀子进程组）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer }, description: "task_runs 的行 id（整数）——不是容器名；只有 queued/running 可取消" }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { id: { type: integer }, canceled: { type: boolean } } } } } } } }
        '404': { description: 任务不存在 }
        '409': { description: 任务已结束（queued/running 之外），无法取消 }
  /api/v1/tasks/{id}/output:
    get:
      tags: [tasks]
      summary: 任务输出尾部读取
      parameters: [{ name: id, in: path, required: true, schema: { type: integer }, description: "task_runs 的行 id（整数）——不是容器名" }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { id: { type: integer }, lines: { type: array, items: { type: string } }, note: { type: string } } } } } } } }
        '404': { description: 任务不存在 }

  # ───────── 设置 / 用户 / 审计 ─────────
  /api/v1/settings:
    get:
      tags: [settings]
      summary: 面板设置（三段诚实模型）
      security: [cookieAuth]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/SettingsReport' } } } } } } }
    patch:
      tags: [settings]
      summary: 修改 runtime 设置（当前仅 AI 助手 LLM 四键；api_key 经主密钥加密，GET 永不明文）
      description: |
        白名单：`assistant.llm_endpoint`（http(s) URL）/ `assistant.llm_model` /
        `assistant.llm_api_key`（值 null = 清除）/ `assistant.llm_narrative`
        （布尔；false = 关，缺省即关——开启才会把脱敏后的诊断数据发往配置的 Endpoint）。
        部署级键（read_only/tier/max_login_attempts/session_idle_timeout）返回 400——请改 config.toml 并重启。
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsPatch' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/SettingsReport' } } } } } } }
  /api/v1/settings/dashboard:
    get:
      tags: [settings]
      summary: 概览页卡片布局（指标卡顺序与显隐）
      description: |
        读取概览页指标卡的展示顺序与显隐（个性化偏好，面板级共享）。
        缺失 / 损坏时回落默认布局（全部可见、默认顺序）。仅需登录。
      security: [cookieAuth]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/DashboardLayout' } } } } } } }
    put:
      tags: [settings]
      summary: 保存概览页卡片布局（整体替换，需 settings.manage）
      description: |
        `cards` 为 1..=5 的数组；id ∈ {cpu, mem, disk, load, net} 且不重复，
        数组顺序即展示顺序；至少一张 visible。任一不满足 → 400（不部分写入）。
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardLayout' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/DashboardLayout' } } } } } } }
  /api/v1/settings/onboarding:
    get:
      tags: [settings]
      summary: 首启上手清单（5 步 + 自动判定进度）
      description: |
        返回固定的 5 步：信任根证书 → 创建站点 → 申请证书 → 开启 WAF → 备份计划。
        `done = checked ∪ 后端可判定的真实状态`：建了站就算完成，不靠用户记得勾选；
        `auto=true` 的步骤由真实状态判定，前端据此禁用勾选框（勾了结果也不变）。
        仅需登录。
      security: [cookieAuth]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/OnboardingState' } } } } } } }
    put:
      tags: [settings]
      summary: 保存上手清单进度（整体替换，需 settings.manage）
      description: |
        `checked` 元素须为已知步骤 id（重复自动去重，未知 id → 400）；
        `dismissed=true` = 不再显示清单。任一字段非法 → 400，不部分写入。
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingPut' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/OnboardingState' } } } } } }
        '400': { description: checked 含未知 id / dismissed 非布尔 }
  /api/v1/settings/llm/test:
    post:
      tags: [settings]
      summary: 测试 AI 助手 LLM 接入（真实探测 OpenAI 兼容 /v1/models，需 settings.manage）
      description: |
        请求体三个字段都可省略：省略即测库里已存的配置，填写即测当前输入
        （**先测后存**，避免保存后才发现配错）。

        判定：HTTP 2xx 且响应可解析为 OpenAI 兼容 JSON ⇒ ok=true，并核对
        配置的 model 是否在 /v1/models 列表里（model_found）。

        **探测失败一律 ok:false + detail，不返回 500**——密钥填错是配置问题，
        不是服务器错误；返回 500 会让前端把「密钥无效」显示成「请求失败」。

        端点由管理员填写 ⇒ 这是一次管理员发起的外发请求：仅 settings.manage
        可调用，响应体回显截断到 200 字符，密钥不落日志、不回显。
      security: [cookieAuth, csrfHeader]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/LlmTestReq' } } } }
      responses:
        '200': { description: 探测完成（成功与失败都在这里，看 data.ok）, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/LlmTestResult' } } } } } }
        '400': { description: 未配置 Endpoint / Endpoint 不是合法 http(s) URL }
  /api/v1/roles:
    get:
      tags: [users]
      summary: 角色列表（内置 builtin=true + 自定义）+ 已知权限白名单
      security: [cookieAuth, csrfHeader]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: object, properties: { roles: { type: array, items: { $ref: '#/components/schemas/Role' } }, known_permissions: { type: array, items: { type: string } } } } } }
    post:
      tags: [users]
      summary: 新建自定义角色（防提权：权限必须是调用者自身权限的子集）
      security: [cookieAuth, csrfHeader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name:        { type: string, description: "2~32 位、小写字母开头，只含小写字母/数字/_/-；内置角色名为保留字" }
                permissions: { type: array, items: { type: string }, description: "必须在 known_permissions 内，且必须是调用者自身权限的子集" }
      responses:
        '200': { description: 已创建 }
        '400': { description: 名称非法 / 权限未知 / 超出自身权限 / 与内置同名 }
  /api/v1/roles/{name}:
    patch:
      tags: [users]
      summary: 修改自定义角色权限（**不开放改名**——users.role 存的是名字，改名会让引用悬空）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: { type: array, items: { type: string } }
      responses:
        '200': { description: ok }
        '400': { description: 内置角色不可改 / 权限超出自身 }
    delete:
      tags: [users]
      summary: 删除自定义角色（内置拒绝；**仍被用户引用时拒绝**，避免那些账号静默变成零权限）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: ok }
        '400': { description: 内置角色 / 仍被用户引用 }

  /api/v1/users:
    get:
      tags: [users]
      summary: 用户列表
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { type: array, items: { $ref: '#/components/schemas/User' } } } } } } } }
    post:
      tags: [users]
      summary: 新建用户
      security: [cookieAuth, csrfHeader]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserCreate' } } } }
      responses: { '201': { description: 已创建 } }
  /api/v1/users/{id}:
    patch:
      tags: [users]
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserPatch' } } } }
      responses: { '204': { description: ok } }
    delete:
      tags: [users]
      summary: 删除用户（owner 不可删）
      security: [cookieAuth, csrfHeader]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: ok } }
  /api/v1/audit:
    get:
      tags: [audit]
      summary: 审计日志查询（分页 + 筛选）
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: "兼容旧调用方：未传 page_size 时作为每页条数，同样受 1..=100 约束" }
        - { name: action, in: query, schema: { type: string }, description: 动作精确匹配，如 auth.login }
        - { name: actor,  in: query, schema: { type: string }, description: 操作人精确匹配 }
        - { name: result, in: query, schema: { type: string }, description: "结果精确匹配（ok|denied|error|queued）" }
        - { name: q,      in: query, schema: { type: string }, description: 关键词，模糊匹配 target / detail_json }
        - { name: since,  in: query, schema: { type: integer }, description: 起始时间戳（含，Unix 秒） }
        - { name: until,  in: query, schema: { type: integer }, description: 截止时间戳（含，Unix 秒）；不得早于 since，否则 400 }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope', properties: { data: { $ref: '#/components/schemas/AuditPage' } } } } } } }

  # ───────── SSE 实时频道 ─────────
  /api/v1/events/metrics:
    get:
      tags: [events]
      summary: SSE：指标推送（nano 档位关闭，前端改轮询）
      responses: { '200': { description: text/event-stream } }
  /api/v1/events/tasks:
    get:
      tags: [events]
      summary: SSE：任务进度/输出推送
      responses: { '200': { description: text/event-stream } }
  /api/v1/events/logs:
    get:
      tags: [events]
      summary: SSE：日志增量推送
      responses: { '200': { description: text/event-stream } }

  # ───────── AI 运维助手（只读诊断） ─────────
  /api/v1/assistant/diagnose:
    post:
      tags: [assistant]
      summary: 诊断问答（内置规则引擎，只读）
      description: |
        采集指标/进程/服务/日志/安全基线/备份记录，按确定性规则产出
        Finding{severity, evidence(真实数据引用), suggestion, action}。
        问句经轻量关键词路由到诊断域（all/cpu/mem/disk/log/service/security/backup）；
        未命中即全量体检。**只读**：action 仅 navigate，处置由用户在对应视图人工确认。
      security: [cookieAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: [string, "null"], description: 自然语言问句，可空 }
      responses:
        '200': { description: 诊断报告, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantReport' } } } }

  # ───────── 内置 Web 终端（WebSocket） ─────────
  /api/v1/terminal:
    get:
      tags: [terminal]
      summary: 内置 Web 终端（WebSocket 升级，101）
      description: |
        WebSocket 升级端点。**不支持** REST 语义，需在 101 之后按私有帧协议通信：

        - 服务端 → 客户端：`Binary` = PTY 原始输出；`Text` = 控制 JSON
          `{"t":"ready","shell":"bash"}` / `{"t":"exit","code":N}` / `{"t":"notice","msg":"..."}`。
        - 客户端 → 服务端：`Binary` = 用户输入原始字节；`Text` = 控制 JSON
          `{"t":"resize","cols":N,"rows":N}`。

        卫士（升级前判定）：登录 Cookie `panel_sid` + `perm::SYSTEM_MANAGE` 权限 +
        能力位 `terminal.manage` + 非只读模式 + Origin 同源（WS 升级无法带 X-CSRF-Token）。
      responses:
        '101': { description: WebSocket 协议切换（升级成功） }
        '401': { description: 未登录 }
        '403': { description: 权限/只读/同源校验失败 }
        '10009': { description: 本机无可用交互 shell（terminal.manage=false） }
        '503': { description: 终端并发上限 }
