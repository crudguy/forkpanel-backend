name: Release

# 触发：
#   - 推送 v* tag（如 v0.1.0）自动发版
#   - 手动 workflow_dispatch（可选填 version 覆盖）
#
# 产物：dist/panel-linux-{amd64,arm64}.tar.gz(+.sig) + SHA256SUMS，上传到 GitHub Release。
# 用户侧安装：curl -fsSL https://raw.githubusercontent.com/crudguy/forkpanel-backend/main/deploy/get-panel.sh | sh
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号（如 0.1.0）；留空则用触发的 tag'
        required: false

# 创建 Release 并上传资产需要写权限
permissions:
  contents: write

jobs:
  release:
    name: 跨平台 musl 静态构建 + 签名 + 发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出后端
        uses: actions/checkout@v4

      # 前端是独立仓库（现已公开）。发布构建必须拷真实 dist，不能用 CI 那次
      # 占位的 index.html——没有前端就不能发版，故这一步失败即中止（不 continue-on-error）。
      # 仓库公开后不再需要 token；仍保留 token 字段以便将来若改回私有可直接配 secret。
      - name: 检出前端仓
        uses: actions/checkout@v4
        with:
          repository: crudguy/forkpanel-frontend
          path: forkpanel-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}

      - name: Rust 工具链 + musl 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # 预编译二进制，比 cargo install 快得多
      - name: 安装 cargo-zigbuild（跨平台 musl 静态编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建前端
        working-directory: forkpanel-frontend
        run: |
          corepack enable
          corepack pnpm@9 install --frozen-lockfile
          corepack pnpm@9 build

      - name: 同步前端 dist 进后端 web/dist（供 RustEmbed 编译）
        run: |
          rm -rf web/dist/* && cp -a forkpanel-frontend/dist/. web/dist/
          touch crates/panel-cli/src/embed.rs

      # ★ 发布门槛：门禁 + 全量测试，不过则中止，决不让坏代码被签名发出去。
      # 用真实前端（上面已 build+同步），比 CI 占位 web/dist 更严格——
      # 同时验证「嵌入新鲜度」这一发布特有的风险点。
      # ⚠ 打 tag 的 push 不会触发 ci.yml（它只绑 main 分支），所以这一步是
      #   release 自己兜底的防线，不能省。
      - name: 门禁 + 全量测试（发布门槛，不过则中止）
        run: make check
        env:
          PANEL_FRONTEND_ROOT: ${{ github.workspace }}/forkpanel-frontend
          PANEL_FRONTEND_OPENAPI: ${{ github.workspace }}/forkpanel-frontend/src/api/openapi.yaml
          FE_DIST: ${{ github.workspace }}/forkpanel-frontend/dist

      # 把 tag 版本写进 Cargo.toml，否则二进制自报的版本恒为源码里的旧值
      # （panel 的 /api/v1/version 取 env!("CARGO_PKG_VERSION")），
      # 导致 v0.2.0 的面板「关于」显示 0.1.0。改法只动工作区、不提交。
      - name: 版本号对齐 tag
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          V="${V#v}"                       # v0.1.0 → 0.1.0
          echo "发布版本：$V"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$V\"/" Cargo.toml
          grep -n '^version' Cargo.toml | head -2

      - name: 写入 ed25519 签名私钥（来自 secret，绝不入库）
        run: |
          [ -n "${{ secrets.PANEL_RELEASE_KEY }}" ] || { echo "缺少 secret PANEL_RELEASE_KEY（ed25519 私钥 PEM）" >&2; exit 1; }
          printf '%s\n' "${{ secrets.PANEL_RELEASE_KEY }}" > "$HOME/.forkpanel-release.key"
          chmod 600 "$HOME/.forkpanel-release.key"

      # 复用 deploy/build-static.sh（打包 + 签名的单一事实源），避免两处漂移
      - name: 静态构建 + 签名 tarball
        run: ./deploy/build-static.sh "${{ github.event.inputs.version || github.ref_name }}"

      - name: 生成 SHA256SUMS
        run: ( cd dist && sha256sum panel-linux-*.tar.gz > SHA256SUMS )

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/panel-linux-amd64.tar.gz
            dist/panel-linux-amd64.tar.gz.sig
            dist/panel-linux-arm64.tar.gz
            dist/panel-linux-arm64.tar.gz.sig
            dist/SHA256SUMS
          # tag 名含 "-"（如 v0.1.0-rc1）视为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
