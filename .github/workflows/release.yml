name: Release

# 触发：
#   - 推送 v* tag（如 v0.1.0）自动发版
#   - 手动 workflow_dispatch（可选填 version 覆盖）
#
# 产物：dist/panel-linux-{amd64,arm64}.tar.gz(+.sig) + SHA256SUMS，上传到 GitHub Release。
# 用户侧安装（两步法 + 固定版本 URL；不要从 main 分支实时 curl | sh —— 验签公钥
# 内嵌在被取回的脚本里，脚本被替换即可连公钥一起换掉，验签信任起点会被绕过）：
#   TAG=v0.1.0
#   wget -O get-panel.sh https://raw.githubusercontent.com/crudguy/forkpanel-backend/$TAG/deploy/get-panel.sh
#   sh get-panel.sh                 # 先读一遍再本地执行；PANEL_VERSION 可钉版本
# 详见 docs/distribution.md 的「两步法」。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号（如 0.1.0）；留空则用触发的 tag'
        required: false

# 创建 Release 并上传资产需要写权限
permissions:
  contents: write

jobs:
  release:
    name: 跨平台 musl 静态构建 + 签名 + 发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出后端
        uses: actions/checkout@v4

      # 前端是独立仓库（现已公开）。发布构建必须拷真实 dist，不能用 CI 那次
      # 占位的 index.html——没有前端就不能发版，故这一步失败即中止（不 continue-on-error）。
      # 仓库公开后不再需要 token；仍保留 token 字段以便将来若改回私有可直接配 secret。
      - name: 检出前端仓
        uses: actions/checkout@v4
        with:
          repository: crudguy/forkpanel-frontend
          path: forkpanel-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}

      # 工具链版本 / musl 目标 / clippy 锁定 1.98.1（与仓库根 rust-toolchain.toml 一致）：
      # 显式写死，避免 action 默认拉 latest stable 触发「新 deprecation 把 -D warnings 打成错误」
      # 这类移动靶。本地 rustup 也吃 rust-toolchain.toml，故本地与 CI 工具链完全一致。
      - name: Rust 工具链 + musl 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # 预编译二进制，比 cargo install 快得多
      - name: 安装 cargo-zigbuild（跨平台 musl 静态编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # ⚠ cargo-zigbuild 只是 cargo 子命令包装器，**不含 zig 编译器本体**——
      #   缺 zig 时它报 `Failed to find zig / cannot find binary path` 直接挂。
      #   必须单独装 zig（taiki-e/install-action 的工具清单里没有 zig，只能走
      #   cargo-binstall 兜底，而 zig 不是 Rust crate ⇒ 兜底也失败，故用官方 setup-zig）。
      - name: 安装 Zig 编译器（cargo-zigbuild 的 linker 后端）
        uses: mlugg/setup-zig@v2
        with:
          # 钉死版本，理由同 rust 1.98.1：留空（""）会 fallback 到 latest，
          # 某天 zig 发新版改了 musl/CLI 行为就把发版搞红，属于同一类「移动靶」。
          # 0.16.0 = cargo-zigbuild 维护者 Dockerfile 实际验证过的版本。
          version: "0.16.0"

      - name: Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建前端
        working-directory: forkpanel-frontend
        run: |
          corepack enable
          corepack pnpm@9 install --frozen-lockfile
          corepack pnpm@9 build

      # ⚠ 必须先 mkdir -p web/dist：干净 checkout 时后端仓**没有 web/ 目录**
      #   （web/dist 被 .gitignore，空目录不入库），直接 cp 会报
      #   "cp: 无法创建目录 'web/dist/': 没有那个文件或目录" 而中止发版。
      #   本地能过是因为那目录一直存在——CI 从零开始才暴露。
      - name: 同步前端 dist 进后端 web/dist（供 RustEmbed 编译）
        run: |
          mkdir -p web/dist
          rm -rf web/dist/*
          cp -a forkpanel-frontend/dist/. web/dist/
          touch crates/panel-cli/src/embed.rs
          echo "内嵌产物：$(find web/dist -type f | wc -l) 个文件"

      # ★ 发布门槛：门禁 + 全量测试，不过则中止，决不让坏代码被签名发出去。
      # 用真实前端（上面已 build+同步），比 CI 占位 web/dist 更严格——
      # 同时验证「嵌入新鲜度」这一发布特有的风险点。
      # ⚠ 打 tag 的 push 不会触发 ci.yml（它只绑 main 分支），所以这一步是
      #   release 自己兜底的防线，不能省。
      - name: 门禁 + 全量测试（发布门槛，不过则中止）
        run: make check
        env:
          PANEL_FRONTEND_ROOT: ${{ github.workspace }}/forkpanel-frontend
          PANEL_FRONTEND_OPENAPI: ${{ github.workspace }}/forkpanel-frontend/src/api/openapi.yaml
          FE_DIST: ${{ github.workspace }}/forkpanel-frontend/dist

      # 统一解析 TAG / VER 写进 $GITHUB_ENV，后续步骤（版本对齐 / build-static / 冒烟 /
      # 转正 / 回滚）共用同一份。此前每处各写一遍 `inputs.version || ref_name`，那种
      # 写法在 workflow_dispatch 填 `0.2.0` 时得到**不带 v 的版本号**，拿去
      # `gh release edit` 会找不到 tag（发布后冒烟与回滚都依赖准确的 tag）。
      - name: 解析发布 tag 与版本号
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"                       # v0.2.0 → 0.2.0
          # 双写是刻意的：`$GITHUB_OUTPUT` 供 `with:` 里的表达式用（steps 上下文一定
          # 可用），`$GITHUB_ENV` 供后续 `run:` 的 shell 变量用。
          # ⚠ 只写 GITHUB_ENV 不够——它注入的是 runner 进程环境，**不保证**出现在后续
          #   步骤的 `env` 上下文（`${{ env.TAG }}` 可能取到空串），那个坑会让
          #   `tag_name:` 变成空值而静默用默认 tag。
          echo "tag=v$V"  >> "$GITHUB_OUTPUT"
          echo "ver=$V"   >> "$GITHUB_OUTPUT"
          echo "TAG=v$V"  >> "$GITHUB_ENV"
          echo "VER=$V"   >> "$GITHUB_ENV"
          echo "发布版本：$V（tag：v$V）"

      # 把 tag 版本写进 Cargo.toml，否则二进制自报的版本恒为源码里的旧值
      # （panel 的 /api/v1/version 取 env!("CARGO_PKG_VERSION")），
      # 导致 v0.2.0 的面板「关于」显示 0.1.0。改法只动工作区、不提交。
      - name: 版本号对齐 tag
        run: |
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$VER\"/" Cargo.toml
          grep -n '^version' Cargo.toml | head -2

      - name: 写入 ed25519 签名私钥（来自 secret，绝不入库）
        run: |
          [ -n "${{ secrets.PANEL_RELEASE_KEY }}" ] || { echo "缺少 secret PANEL_RELEASE_KEY（ed25519 私钥 PEM）" >&2; exit 1; }
          printf '%s\n' "${{ secrets.PANEL_RELEASE_KEY }}" > "$HOME/.forkpanel-release.key"
          chmod 600 "$HOME/.forkpanel-release.key"

      # 产物新鲜度的基准：构建**之前**打时间戳，构建之后再比对每个产物的 mtime。
      # 防的是「本次 arm64 构建失败但 dist/ 里躺着上一轮的 arm64 包」——那种情况下
      # 后面每一步都会绿，发出去的是旧架构的二进制（报告 §3.10 P2 要求 newest 进门禁）。
      - name: 记录构建开始时间（产物新鲜度基准）
        run: date +%s > "$RUNNER_TEMP/build-started-at"

      # 复用 deploy/build-static.sh（打包 + 签名的单一事实源），避免两处漂移
      - name: 静态构建 + 签名 tarball
        run: ./deploy/build-static.sh "$VER"
        # 注入构建标识：/api/v1/version 的 build 字段取 option_env!("PANEL_BUILD")，
        # 不注入则恒为 "dev"（此前发行版一直显示 dev，与 docs/env.md「CI 可注入」不符）。
        # 用 commit SHA 作构建号，便于从「关于/版本徽标」反查来源。
        env:
          PANEL_BUILD: ${{ github.sha }}

      - name: 生成 SHA256SUMS
        run: ( cd dist && sha256sum panel-linux-*.tar.gz > SHA256SUMS )

      # ⚠ 必须在上传 Release **之前**。用安装器内嵌的那把公钥回验，而不是用私钥
      #   导出公钥自验（自己跟自己比恒绿）：secret 私钥与仓库内嵌公钥不匹配、
      #   产物被篡改、双架构缺一、SHA256SUMS 不符 ⇒ 当场中止发版，不再等用户侧
      #   get-panel.sh 验签失败才发现。判据与用户侧同源（同一条 dgst -verify）。
      - name: 回验发布产物（安装器内嵌公钥 + 双架构 + SHA256SUMS）
        run: bash ci/verify-release-assets.sh . dist

      # 结构完整之外再判「新鲜度」：产物必须晚于本次构建开始时间。缺这条时，
      # `cargo zigbuild` 若因缓存跳过 arm64、而 dist/ 里又躺着上一轮的 arm64 包，
      # 回验照样全绿——发出去的是旧架构二进制（报告 §3.10 P2「产物比源码旧 5 天」）。
      - name: 产物新鲜度（mtime ≥ 本次构建开始）
        run: |
          base="$(cat "$RUNNER_TEMP/build-started-at")"
          bad=0
          for f in dist/panel-linux-amd64.tar.gz dist/panel-linux-arm64.tar.gz dist/SHA256SUMS; do
            [ -f "$f" ] || { echo "✗ 缺少 $f" >&2; bad=1; continue; }
            m="$(stat -c %Y "$f")"
            if [ "$m" -lt "$base" ]; then
              echo "✗ $f 比本次构建开始早 $((base - m))s —— 上一轮残留，不是本次产物" >&2
              bad=1
            else
              echo "  ✓ $f 新鲜（+$((m - base))s）"
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      # ⚠ 先传成 **draft**：此刻用户看不到这个 Release。见文件末尾的「自动回滚」。
      - name: 上传为草稿 Release（用户不可见）
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/panel-linux-amd64.tar.gz
            dist/panel-linux-amd64.tar.gz.sig
            dist/panel-linux-arm64.tar.gz
            dist/panel-linux-arm64.tar.gz.sig
            dist/SHA256SUMS
          # tag 名含 "-"（如 v0.1.0-rc1）视为预发布
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          generate_release_notes: true

      # 发布后冒烟：把**刚上传的资产下载回来**再验一遍。上面那轮验的是「准备发的」，
      # 这轮验「用户真能下到的」——漏传 / 上传损坏 / 资产改名只有这轮看得见。
      - name: 发布后冒烟（下载资产 + 验签 + 跑二进制 + 判架构）
        run: bash ci/release-smoke.sh "${{ github.repository }}" "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 冒烟通过才转正：这是整个流程里唯一的「发布可见」动作。
      - name: 冒烟通过 → 转为正式发布
        run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ★ 自动回滚路径：任何后续失败都把 Release 按回 draft。
      # 为什么是 draft 而不是「删除 Release」：草稿用户不可见，等价于撤销发布，但
      #   ① 不丢已上传资产（便于人工排查）② 不需要第二次网络写操作（删除失败会留窗口期）
      #   ③ 重跑 workflow 时 softprops 更新同一 Release，幂等。
      - name: 失败 → 撤销发布可见性（保持草稿）
        if: failure()
        run: |
          echo "::error::发布流程失败，Release $TAG 保持 draft（用户不可见）；修好后重跑本 workflow。"
          gh release edit "$TAG" --draft=true || echo "（Release 可能尚未创建，忽略）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
