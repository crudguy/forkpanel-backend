name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态门禁 + 全量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2

      # 契约 / 权限点 / 包白名单 / UI 守卫 / 内嵌新鲜度五个门禁都需要前端。
      # 前端是**私有**独立仓：配了 secrets.FRONTEND_REPO_TOKEN 才拉得下来。
      # ⚠ `check-ui-guards.sh` 在前端入口缺失时**硬判红**（不是 [skip]），
      #   所以「CI 要求前端仓必须检出」是既有约束，不是本 job 新增的。
      - name: 检出前端仓（私有仓需 secrets.FRONTEND_REPO_TOKEN）
        id: frontend
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: crudguy/forkpanel-frontend
          path: forkpanel-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      # ⭐ 内嵌新鲜度（ci/check-embed-fresh.sh）在 CI 的**唯一**覆盖来源。
      #   该门禁比对 `web/dist` 与前端 `dist`。此前 CI 从不构建前端、`FE_DIST`
      #   又指向被 .gitignore 的目录 ⇒ 它**必然 [skip] exit 0**，于是
      #   「改了前端却发出旧前端、编译/类型/测试全绿」这条唯一防线在 CI 上是空的
      #   （报告 §3.9 P1，仅靠 release.yml 单点兜底）。这里补上构建+同步，
      #   步骤与 release.yml 逐字对齐，保证「CI / 发版 / 本地」同一套口径。
      - name: 构建前端并同步内嵌产物（embed-fresh 真检查的前提）
        if: steps.frontend.outcome == 'success'
        run: |
          cd forkpanel-frontend
          corepack enable
          corepack pnpm@9 install --frozen-lockfile
          corepack pnpm@9 build
          cd ..
          # 必须 rm -rf 再 cp：只 cp 只增不删，会留下旧 hash 的僵尸 chunk，
          # 既撑大二进制又让 embed-fresh 的僵尸检查失去意义
          rm -rf web/dist
          mkdir -p web/dist
          cp -a forkpanel-frontend/dist/. web/dist/
          # touch 让 cargo 重新执行 RustEmbed（否则 rust-cache 命中时仍嵌旧产物）
          touch crates/panel-cli/src/embed.rs
          echo "内嵌产物：$(find web/dist -type f | wc -l) 个文件"

      # 兜底：前端仓拉不下来时仍要能编译——embed.rs 的
      # #[folder="../../web/dist"] 在**编译期**要求目录存在（web/dist 被 gitignore）。
      # ⚠ `if` 不能省：无条件执行会用占位覆盖上面已同步的真产物，
      #   让 embed-fresh 静默退回「内容不一致」的假红或直接失配。
      - name: 占位 web/dist（仅前端仓不可用时，供 RustEmbed 编译）
        if: steps.frontend.outcome != 'success'
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '<!doctype html><meta charset="utf-8"><title>ForkPanel CI placeholder</title>\n' > web/dist/index.html
          fi

      # 与本地 `make check` 完全一致
      - name: 门禁（make check）
        run: make check
        env:
          # 指向上面 checkout 的前端仓；未 checkout 成功时路径不存在 → 各门禁显式 [skip]
          PANEL_FRONTEND_ROOT: ${{ github.workspace }}/forkpanel-frontend
          PANEL_FRONTEND_OPENAPI: ${{ github.workspace }}/forkpanel-frontend/src/api/openapi.yaml
          FE_DIST: ${{ github.workspace }}/forkpanel-frontend/dist

  e2e:
    name: 真机端到端（自包含临时实例）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2

      # RustEmbed 的 #[folder="../../web/dist"] 在编译期要求目录存在；
      # CI 只需让二进制能编译，不需要真实前端（SPA 由 release.yml 单独打包）。
      - name: 生成占位 web/dist（供 RustEmbed 编译）
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '<!doctype html><meta charset="utf-8"><title>ForkPanel CI placeholder</title>\n' > web/dist/index.html
          fi

      # ⚠ 退出码是权威信号：e2e-all.sh 在任一域 [skip] 时非零退出，
      #   「跳过 ≠ 通过」。这里绝不加 continue-on-error / || true，
      #   否则会重演「什么都没验证却报绿」。runner 自带 curl/python3/ss，
      #   脚本在临时目录拉起独立实例，不碰 /etc 与 /var/lib、不需要 root。
      - name: 零 root 端到端（run-e2e-ci.sh）
        run: bash ci/run-e2e-ci.sh
        env:
          PANEL_E2E_TIMEOUT: "900"

  audit:
    name: 依赖安全审计（cargo audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      # 预编译二进制，比 cargo install 快得多
      - uses: taiki-e/install-action@cargo-audit

      # 单独 job：advisory-db 在 GitHub，网络抖动时只红这一个 job，
      # 不连带拖红主门禁（check-audit.sh 自身也有网络失败回退本地缓存的逻辑）
      - name: 审计（make audit）
        run: make audit
