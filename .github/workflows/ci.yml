name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态门禁 + 全量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 契约 / 权限点 / 包白名单三个门禁需要前端源码。前端是**私有**独立仓：
      # 配了 secrets.FRONTEND_REPO_TOKEN 才拉得下来；未配时本步失败但
      # continue-on-error 不拖红 job，三个脚本会各自显式 [skip]（非通过）。
      - name: 检出前端仓（私有仓需 secrets.FRONTEND_REPO_TOKEN）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: crudguy/forkpanel-frontend
          path: forkpanel-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      # CI 只跑后端逻辑测试，不需要真实前端产物；但 embed.rs 的
      # #[folder="../../web/dist"] 在**编译期**要求目录存在（web/dist 被 gitignore，
      # 由前端仓构建后拷入）。生成一个占位 index.html 让 cargo test 可编译。
      # ⚠ 发布构建仍必须拷真实前端 dist（占位仅用于 CI 测试编译）。
      - name: 生成占位 web/dist（仅 CI，供 RustEmbed 编译）
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '<!doctype html><meta charset="utf-8"><title>ForkPanel CI placeholder</title>\n' > web/dist/index.html
          fi

      # 与本地 `make check` 完全一致
      - name: 门禁（make check）
        run: make check
        env:
          # 指向上面 checkout 的前端仓；未 checkout 成功时路径不存在 → 各门禁显式 [skip]
          PANEL_FRONTEND_ROOT: ${{ github.workspace }}/forkpanel-frontend
          PANEL_FRONTEND_OPENAPI: ${{ github.workspace }}/forkpanel-frontend/src/api/openapi.yaml
          FE_DIST: ${{ github.workspace }}/forkpanel-frontend/dist

  audit:
    name: 依赖安全审计（cargo audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # 预编译二进制，比 cargo install 快得多
      - uses: taiki-e/install-action@cargo-audit

      # 单独 job：advisory-db 在 GitHub，网络抖动时只红这一个 job，
      # 不连带拖红主门禁（check-audit.sh 自身也有网络失败回退本地缓存的逻辑）
      - name: 审计（make audit）
        run: make audit
