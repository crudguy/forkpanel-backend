[package]
name = "panel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "面板可执行文件：init / doctor / migrate / serve / backup"

[dependencies]
panel-core = { path = "../panel-core" }
panel-os   = { path = "../panel-os" }
panel-db   = { path = "../panel-db" }
panel-api  = { path = "../panel-api" }
panel-task = { path = "../panel-task" }

axum       = { version = "0.8", default-features = false, features = ["http1", "json", "macros"] }
tokio      = { workspace = true }
clap       = { version = "4", features = ["derive"] }
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = "0.8"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand       = "0.8"
rusqlite   = { workspace = true }

# 静态资源内嵌：运行期零 Node、零外部文件依赖
rust-embed = { version = "8", features = ["mime-guess", "compression"] }

# 面板本体**不提供 HTTPS 监听**（serve 只有 http）：TLS 由前置 nginx/Caddy 终结。
# 历史上有过一个 `tls` 占位特性（axum-server / rustls / rustls-pemfile / tokio-rustls），
# 但**从未接线**（全仓零个 `#[cfg(feature = "tls")]`）——已删除，避免"启用它就能开
# HTTPS"的误解。`[server].tls` 字段仍在，但配了会被 Config::validate_implemented()
# 拒绝启动（bc4b7ac）。若将来真要实现面板自身 TLS，请连同依赖与 serve 分支一起加。

# 开发期从磁盘读取 web/dist，避免每次改前端都重编译二进制
[features]
default = []
dev-assets = []

[[bin]]
name = "panel"
path = "src/main.rs"
