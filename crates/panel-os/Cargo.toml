[package]
name = "panel-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OS 抽象层：trait 契约 + Linux 实现 + 内存 mock（用于一致性测试）"

[dependencies]
panel-core = { path = "../panel-core" }
serde       = { workspace = true }
async-trait = { workspace = true }
tokio      = { workspace = true }
libc       = { workspace = true }
tracing    = "0.1"
# 内建 SQLite 浏览（面板自带引擎，无需外部客户端）；工作区已用同版本，不引入新外部 crate
rusqlite   = { workspace = true }
# 解析 journalctl -o json 每行（ts/message/priority）
serde_json = { workspace = true }
# 仅用于「安全导入助手」：解析**外部提供的** compose YAML，只抽取白名单子集、
# 绝不通传未知字段（见 compose_stack.rs 的 parse_compose_import）。这不是放开
# "允许用户提交原始 YAML"——抽取结果仍受 ComposeStackService 类型白名单约束。
serde_yaml = "0.9"

[features]
default = []
# 强制使用内存实现（CI / 非 Linux 开发环境）
force-mock = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# 源码级守卫要读本 crate 的生产段（dev-dep 不计入直接依赖预算）
panel-testutil = { path = "../panel-testutil" }
