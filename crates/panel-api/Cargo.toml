[package]
name = "panel-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP 层：路由、鉴权与 RBAC、CSRF、SSE、统一响应 envelope"

[dependencies]
panel-core = { path = "../panel-core" }
panel-os   = { path = "../panel-os" }
panel-db   = { path = "../panel-db" }
panel-task = { path = "../panel-task" }

# 注意：axum 0.8 把 Query 提取器放到了 `query` feature 之后；
# 本仓刻意关掉默认特性控体积，故必须显式开启，否则 axum::extract::Query 不存在。
# `ws` 供内置终端使用（WebSocket 升级 + 帧编解码，含 tokio-tungstenite 传递依赖）。
axum       = { version = "0.8", default-features = false, features = ["http1", "json", "macros", "query", "tokio", "ws"] }
tokio      = { workspace = true }
async-trait = { workspace = true }
tower      = { version = "0.5", features = ["limit", "util"] }
# panic 兜底：CatchPanicLayer 把 handler panic 转成结构化 500（见 src/panic_guard.rs）。
# 只开 catch-panic 特性、且 tower-http 本就在依赖树里（axum 传递）⇒ 零新增 crate。
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
async-stream = "0.3"
futures-util = "0.3"
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
argon2     = "0.5"          # 密码哈希；登录时瞬时占用 8~19MB（按档位）
rand       = "0.8"
hmac       = "0.12"
sha2       = "0.10"
sha1       = "0.10"   # TOTP (RFC 6238)：HMAC-**SHA1**，Google Authenticator 只认 SHA1 档位
time       = { version = "0.3", features = ["formatting", "parsing"] }
rusqlite   = { workspace = true }

# 外发 HTTP：本仓唯一用途是设置页「测试连接」——探测 OpenAI 兼容的 /v1/models
# （评估报告 C10 的验证闭环）。刻意关掉默认特性控体积：只要 JSON 与 rustls
# （纯 Rust TLS，不引入 openssl 构建依赖），不需要 http2 / 系统代理探测。
# 注：reqwest 0.13 把 `rustls-tls` 更名为 `rustls`（默认 crypto provider），
# `rustls-tls-*` 那套旧名字已不存在。
reqwest    = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# 源码守卫的「生产段」提取器（剔注释 + 剥 cfg(test) 块）。共享实现，
# 避免各 crate 各留一份、语义漂移成「一份挡得住一份挡不住」。
panel-testutil = { workspace = true }
